<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>search test</title></head>
<body>
<pre id="out">pending</pre>
<iframe id="fr" src="/index.html" style="width:1200px;height:900px"></iframe>
<script>
var log = [];
function ok(name, pass) { log.push((pass ? "PASS " : "FAIL ") + name); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

document.getElementById("fr").addEventListener("load", function () {
  setTimeout(run, 900);
});

async function run() {
  var fr = document.getElementById("fr");
  var d = fr.contentDocument, w = fr.contentWindow;
  var input = d.getElementById("searchInput");
  var heads = d.querySelectorAll("li.year-head");
  var lis = d.querySelectorAll("li[data-slug]");

  ok("年份头存在", heads.length === 1);
  ok("文章条数 4", lis.length === 4);

  var fetched = function () {
    return w.performance.getEntriesByType("resource").some(function (e) {
      return e.name.indexOf("search-index.json") >= 0;
    });
  };

  ok("首屏没有请求搜索索引（懒加载）", !fetched());

  function setKw(v) {
    input.value = v;
    input.dispatchEvent(new w.Event("input", { bubbles: true }));
  }

  // 搜正文里的词（只有索引里有）
  setKw("悬浮球");
  await sleep(700);
  var vis = Array.prototype.filter.call(lis, function (li) { return li.style.display !== "none"; });
  ok("首次搜索才拉索引", fetched());
  ok("正文关键词能搜到 1 篇", vis.length === 1 && vis[0].getAttribute("data-slug") === "floating-ball");

  // 搜不到的词
  setKw("zzzz不存在的词");
  await sleep(400);
  var vis2 = Array.prototype.filter.call(lis, function (li) { return li.style.display !== "none"; });
  ok("搜不到时全部隐藏", vis2.length === 0);
  ok("搜不到时年份头也隐藏", Array.prototype.some.call(heads, function (h) { return h.style.display === "none"; }));

  // 清空恢复
  setKw("");
  await sleep(400);
  var vis3 = Array.prototype.filter.call(lis, function (li) { return li.style.display !== "none"; });
  ok("清空后全部恢复", vis3.length === 4);
  ok("清空后年份头恢复", Array.prototype.every.call(heads, function (h) { return h.style.display !== "none"; }));

  // 类别筛选不依赖索引
  var cat = d.getElementById("catFilter");
  cat.value = "前端";
  cat.dispatchEvent(new w.Event("change", { bubbles: true }));
  await sleep(300);
  var vis4 = Array.prototype.filter.call(lis, function (li) { return li.style.display !== "none"; });
  ok("类别筛选正常", vis4.length >= 1 && vis4.every(function (li) {
    return li.getAttribute("data-category") === "前端";
  }));

  var fails = log.filter(function (x) { return x.indexOf("FAIL") === 0; }).length;
  document.getElementById("out").textContent = log.join("\n") +
    "\n\n共 " + log.length + " 项，失败 " + fails + " 项";
}
</script>
</body></html>

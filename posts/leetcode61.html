<h2>整体思路</h2>
<blockquote><p>给你一个链表的头节点 head ，旋转链表，将链表每个节点向右移动 k 个位置。</p></blockquote>
<p>题目要求我们对链表进行偏移操作，从把最后的节点移动到开头，可以把链表想象为一个环形，头尾相连，同时滑动新的头节点将链表分割，进行名义上的节点的移动。</p>

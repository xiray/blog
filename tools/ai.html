<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 问答 — xiray</title>
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/hl.js"></script>
<script src="/assets/ai-lang.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%23ffb86b'/></svg>">
<style>
  html, body { height: 100%; overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100vh; }

  /* ================= 顶栏 ================= */
  .bar {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; padding: 0 1rem; height: 3.25rem;
    border-bottom: 1px solid var(--line); background: var(--bg-soft);
  }
  .bar .brand { font-family: var(--serif); font-size: 1rem; font-weight: 600; white-space: nowrap; }
  .bar .brand span {
    color: var(--muted); font-family: var(--sans); font-size: .8125rem;
    font-weight: 400; margin-left: .5rem; letter-spacing: .08em;
  }
  .bar .actions { display: flex; align-items: center; gap: .5rem; min-width: 0; }

  .chip {
    font-family: var(--mono); font-size: .6875rem; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: .12rem .55rem;
    white-space: nowrap; max-width: 15rem; overflow: hidden; text-overflow: ellipsis;
  }

  .status {
    font-size: .8125rem; color: var(--muted); max-width: 20rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .status.ok { color: #6ee7a8; }
  .status.err { color: #ff8f8f; }

  button {
    font: inherit; font-size: .875rem; padding: .4rem .9rem; border-radius: 6px;
    cursor: pointer; transition: all .15s ease; border: 1px solid transparent;
    background: transparent; color: var(--text-dim); white-space: nowrap;
  }
  button:hover { color: var(--text); }
  button.ghost { border-color: var(--line); }
  button.ghost:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: #1a1206; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); color: #1a1206; }
  button:disabled { opacity: .5; cursor: default; filter: none; }
  button.sm { padding: .25rem .6rem; font-size: .75rem; }

  /* ================= 对话区 ================= */
  .chat { flex: 1 1 auto; overflow-y: auto; padding: 1.75rem 1rem 1rem; scroll-behavior: smooth; }
  .thread { max-width: 46rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }

  .msg { position: relative; }
  .msg .who {
    font-family: var(--mono); font-size: .625rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted); margin-bottom: .35rem;
  }
  .msg.user { display: flex; flex-direction: column; align-items: flex-end; }
  .msg.user .body {
    background: var(--bg-soft); border: 1px solid var(--line);
    border-radius: 10px; padding: .55rem .85rem; max-width: 85%;
    white-space: pre-wrap; word-break: break-word; line-height: 1.7;
  }
  .msg.ai .body { line-height: 1.78; color: var(--text); word-break: break-word; }
  .msg.ai .body > :first-child { margin-top: 0; }
  .msg.ai .body > :last-child { margin-bottom: 0; }
  .msg .body p { margin: 0 0 .8em; }
  .msg .body h1, .msg .body h2, .msg .body h3,
  .msg .body h4, .msg .body h5, .msg .body h6 {
    font-family: var(--sans); font-size: .9375rem; font-weight: 650;
    margin: 1.1em 0 .45em; color: var(--text); letter-spacing: .01em;
  }
  .msg .body ul, .msg .body ol { margin: .4em 0 .9em; padding-left: 1.35rem; }
  .msg .body li { margin: .2em 0; }
  .msg .body a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .msg .body blockquote {
    margin: .6em 0; padding: .1rem 0 .1rem .85rem;
    border-left: 2px solid var(--line); color: var(--text-dim);
  }
  .msg .body hr { border: none; border-top: 1px solid var(--line); margin: 1.2em 0; }
  .msg .body code {
    font-family: var(--mono); font-size: .8125rem; background: var(--code-bg);
    border: 1px solid var(--line-soft); border-radius: 4px; padding: .08em .35em;
  }
  .msg .body table { border-collapse: collapse; margin: .6em 0; font-size: .875rem; }
  .msg .body th, .msg .body td { border: 1px solid var(--line); padding: .3rem .6rem; }
  .msg .body th { background: var(--bg-soft); font-weight: 600; }

  .code-wrap { position: relative; margin: .7em 0; }
  .code-wrap pre {
    --code-pad-x: .9rem;
    position: relative;
    margin: 0; background-color: var(--code-bg); border: 1px solid var(--code-line);
    border-radius: 6px; padding: .8rem var(--code-pad-x); overflow-x: auto;
  }
  .code-wrap pre code {
    background: none; border: none; padding: 0; font-size: .8125rem;
    line-height: 1.6; white-space: pre;
  }
  .code-wrap .cp {
    position: absolute; top: .4rem; right: .4rem; padding: .1rem .4rem;
    font-size: .6875rem; color: var(--muted); border: 1px solid var(--line);
    border-radius: 4px; background: var(--bg); opacity: 0; transition: opacity .15s;
  }
  .code-wrap:hover .cp { opacity: 1; }

  .msg .tools { display: flex; gap: .35rem; margin-top: .45rem; opacity: 0; transition: opacity .15s; }
  .msg:hover .tools { opacity: 1; }
  .msg .tools button {
    padding: .1rem .45rem; font-size: .6875rem; color: var(--muted);
    border: 1px solid var(--line); border-radius: 4px;
  }

  .think {
    margin: 0 0 .8em; border-left: 2px solid var(--line); padding-left: .75rem;
  }
  .think summary {
    cursor: pointer; font-size: .75rem; color: var(--muted); list-style: none;
    user-select: none;
  }
  .think summary::-webkit-details-marker { display: none; }
  .think summary::before { content: "▸ "; }
  .think[open] summary::before { content: "▾ "; }
  .think .inner {
    margin-top: .35rem; font-size: .8125rem; color: var(--muted);
    white-space: pre-wrap; line-height: 1.7; max-height: 20rem; overflow-y: auto;
  }

  .err-box {
    border: 1px solid #7f2f2f; background: rgba(255, 90, 90, .07);
    border-radius: 8px; padding: .7rem .85rem; font-size: .875rem;
    color: #ffb4b4; white-space: pre-wrap; line-height: 1.65;
  }
  .err-box button { margin-top: .55rem; }

  .typing::after {
    content: "▍"; color: var(--accent); animation: blink 1s steps(1) infinite;
    margin-left: .1em;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ================= 空状态 ================= */
  .empty { max-width: 46rem; margin: 2.2rem auto 0; text-align: left; }
  .empty h1 {
    font-family: var(--serif); font-size: 1.5rem; font-weight: 600;
    margin: 0 0 .4rem; letter-spacing: .01em;
  }
  .empty p { color: var(--muted); font-size: .875rem; margin: 0 0 1.4rem; }
  .chips { display: flex; flex-wrap: wrap; gap: .5rem; }
  .chips button {
    border: 1px solid var(--line); border-radius: 999px; padding: .35rem .8rem;
    font-size: .8125rem; color: var(--text-dim);
  }
  .chips button:hover { border-color: var(--accent-dim); color: var(--text); }

  /* ================= 输入区 ================= */
  .composer {
    flex: 0 0 auto; padding: .75rem 1rem 1rem; border-top: 1px solid var(--line);
    background: var(--bg);
  }
  .box {
    max-width: 46rem; margin: 0 auto; border: 1px solid var(--line);
    border-radius: 10px; background: var(--bg-soft); padding: .5rem .6rem .45rem;
    transition: border-color .15s ease;
  }
  .box:focus-within { border-color: var(--muted); }
  .box textarea {
    width: 100%; border: none; background: none; resize: none; color: var(--text);
    font-family: var(--sans); font-size: .9375rem; line-height: 1.65;
    padding: .25rem .3rem; max-height: 12rem; outline: none;
  }
  .box textarea::placeholder { color: var(--muted); }
  .box .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; padding: .15rem .15rem 0;
  }
  .box .hint { font-size: .6875rem; color: var(--muted); font-family: var(--mono); }
  .box .hint b { color: var(--text-dim); font-weight: 400; }

  /* ================= 引用文章 ================= */
  .box { position: relative; }
  .row-left { display: flex; align-items: center; gap: .6rem; min-width: 0; }

  .ref-btn {
    display: inline-flex; align-items: center; gap: .3rem; line-height: 1.5;
    padding: .12rem .5rem; font-size: .6875rem; font-family: var(--mono);
    color: var(--muted); border: 1px solid var(--line); border-radius: 5px;
  }
  .ref-btn:hover { border-color: var(--muted); color: var(--text); }
  .ref-btn.on { border-color: var(--accent-dim); color: var(--accent); }

  .ref-chip {
    display: flex; align-items: center; gap: .4rem; min-width: 0;
    margin: 0 .15rem .4rem; padding: .18rem .25rem .18rem .5rem;
    border: 1px solid var(--accent-dim); border-radius: 6px;
    background: rgba(255, 184, 107, .07); font-size: .75rem; color: var(--text-dim);
  }
  .ref-chip[hidden] { display: none; }
  .ref-chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ref-chip .sz {
    flex: 0 0 auto; font-family: var(--mono); font-size: .625rem; color: var(--muted);
  }
  .ref-chip button {
    flex: 0 0 auto; margin-left: auto; padding: 0 .3rem; line-height: 1;
    font-size: .875rem; color: var(--muted); border-radius: 4px;
  }
  .ref-chip button:hover { color: var(--text); background: var(--bg); }

  .ref-pop {
    position: absolute; left: -.05rem; right: -.05rem; bottom: calc(100% + .45rem);
    z-index: 30; display: flex; flex-direction: column;
    max-height: min(23rem, 60vh);
    background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, .5); overflow: hidden;
  }
  .ref-pop[hidden] { display: none; }
  .ref-pop .rp-head {
    flex: 0 0 auto; padding: .45rem .5rem; border-bottom: 1px solid var(--line-soft);
  }
  .ref-pop .rp-head input {
    width: 100%; font: inherit; font-size: .8125rem; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: .35rem .55rem; outline: none;
  }
  .ref-pop .rp-head input:focus { border-color: var(--muted); }
  .ref-list { overflow-y: auto; min-height: 0; padding: .25rem; }
  .ref-item {
    display: block; width: 100%; text-align: left; padding: .4rem .55rem;
    border: none; border-radius: 6px; background: none;
  }
  .ref-item:hover, .ref-item.hl { background: var(--bg); }
  .ref-item .t {
    display: block; font-size: .8125rem; color: var(--text); line-height: 1.5;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ref-item .m {
    display: block; font-family: var(--mono); font-size: .625rem;
    color: var(--muted); margin-top: .1rem;
  }
  .ref-item.draft .t { color: var(--accent); }
  .ref-pop .rp-foot {
    flex: 0 0 auto; padding: .35rem .55rem; border-top: 1px solid var(--line-soft);
    font-size: .6875rem; color: var(--muted); font-family: var(--mono);
  }
  .ref-pop .rp-empty { padding: 1rem .6rem; font-size: .8125rem; color: var(--muted); text-align: center; }

  /* 消息上的引用标记 */
  .ref-tag {
    display: inline-flex; align-items: center; gap: .3rem; margin-bottom: .4rem;
    padding: .05rem .45rem; border: 1px solid var(--line); border-radius: 4px;
    font-family: var(--mono); font-size: .625rem; color: var(--muted);
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background: none;
  }
  .ref-tag.again { cursor: pointer; }
  .ref-tag.again:hover { border-color: var(--accent-dim); color: var(--text-dim); }

  body.mini .ref-chip { font-size: .6875rem; }
  body.mini .ref-pop { max-height: min(20rem, 58vh); }
  @media (max-width: 400px) {
    body.mini .ref-btn .lbl { display: none; }
  }

  /* ================= 设置抽屉 ================= */
  .scrim {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .45);
    opacity: 0; pointer-events: none; transition: opacity .18s ease; z-index: 40;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed; top: 0; right: 0; width: min(23rem, 92vw); height: 100%;
    background: var(--bg-soft); border-left: 1px solid var(--line);
    transform: translateX(102%); transition: transform .22s ease; z-index: 50;
    display: flex; flex-direction: column;
  }
  .drawer.show { transform: none; }
  .drawer header {
    display: flex; align-items: center; justify-content: space-between;
    padding: .9rem 1rem; border-bottom: 1px solid var(--line);
    font-size: .875rem; font-weight: 600;
  }
  .drawer .inner { padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: .95rem; }
  .field { display: flex; flex-direction: column; gap: .3rem; }
  .field label { font-size: .75rem; color: var(--muted); letter-spacing: .04em; }
  .field input {
    font-family: var(--mono); font-size: .8125rem; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: .45rem .6rem; outline: none; width: 100%;
  }
  .field input:focus { border-color: var(--muted); }
  .field .tip { font-size: .6875rem; color: var(--muted); line-height: 1.6; }
  .drawer .foot {
    display: flex; gap: .5rem; align-items: center; flex-wrap: wrap;
    padding-top: .3rem; border-top: 1px solid var(--line-soft); margin-top: .3rem;
  }
  .drawer .msgline { font-size: .75rem; color: var(--muted); line-height: 1.6; }
  .drawer .msgline.ok { color: #6ee7a8; }
  .drawer .msgline.err { color: #ff8f8f; white-space: pre-wrap; }

  /* ================= 小窗模式（mini） =================
     给「一边问答一边写作」用：整体收紧，同屏能塞下完整对话。 */
  body.mini .bar { height: 2.5rem; padding: 0 .55rem; gap: .4rem; }
  body.mini .bar .brand { font-size: .875rem; }
  body.mini .bar .brand span { display: none; }
  body.mini .bar .actions { gap: .3rem; }
  body.mini .chip { max-width: 7.5rem; font-size: .625rem; padding: .1rem .45rem; }
  body.mini .status { max-width: 6.5rem; font-size: .6875rem; }
  body.mini button { font-size: .8125rem; padding: .28rem .6rem; }
  body.mini button.sm { font-size: .6875rem; padding: .2rem .5rem; }

  body.mini .chat { padding: .9rem .7rem .45rem; }
  body.mini .thread { max-width: none; gap: 1.1rem; }
  body.mini .msg .body { font-size: .875rem; }
  body.mini .msg .body h1, body.mini .msg .body h2, body.mini .msg .body h3,
  body.mini .msg .body h4, body.mini .msg .body h5, body.mini .msg .body h6 {
    font-size: .875rem;
  }
  body.mini .msg.user .body { max-width: 92%; }
  body.mini .code-wrap pre { padding: .55rem .6rem; }
  body.mini .code-wrap pre code { font-size: .75rem; }

  body.mini .empty { max-width: none; margin: .5rem auto 0; }
  body.mini .empty h1 { font-size: 1.1rem; margin-bottom: .3rem; }
  body.mini .empty p { font-size: .8125rem; margin-bottom: .9rem; }
  body.mini .chips { gap: .35rem; }
  body.mini .chips button { padding: .25rem .6rem; font-size: .75rem; }

  body.mini .composer { padding: .5rem .55rem .6rem; }
  body.mini .box { padding: .3rem .45rem .3rem; border-radius: 8px; }
  body.mini .box textarea { font-size: .875rem; padding: .2rem .25rem; max-height: 7rem; }
  body.mini .box .hint { display: none; }

  body.mini .drawer header { padding: .7rem .8rem; }
  body.mini .drawer .inner { padding: .8rem; }

  /* 窄到一定宽度就按重要性依次让位：状态 → 模型名 → 站点名 */
  body.mini .bar .actions { flex-wrap: nowrap; }
  @media (max-width: 460px) { body.mini .status { display: none; } }
  @media (max-width: 400px) { body.mini .chip { max-width: 5.5rem; } }
  @media (max-width: 345px) { body.mini .bar .brand { display: none; } }

  /* 对话 / Agent 切换 */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button {
    border: none; background: none; color: var(--muted); cursor: pointer;
    font-size: .75rem; padding: .25rem .55rem; line-height: 1.2;
  }
  .seg button.active { background: var(--bg-soft); color: var(--accent); }
  body.mini .seg button { padding: .2rem .45rem; font-size: .6875rem; }

  /* Agent 改动卡片 */
  .agent-card {
    margin-top: .55rem; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg-soft); overflow: hidden;
  }
  .agent-card .hd {
    display: flex; align-items: center; gap: .4rem;
    padding: .45rem .6rem; font-size: .75rem; color: var(--accent);
    border-bottom: 1px dashed var(--line);
  }
  .agent-card .ops { padding: .45rem .6rem; font-size: .75rem; color: var(--text-dim); }
  .agent-card .ops li { margin: .15rem 0; list-style: none; }
  .agent-card .ops li::before { content: "· "; color: var(--accent); }
  .agent-card .ft { display: flex; gap: .4rem; padding: 0 .6rem .55rem; }
  .agent-card .ft button {
    font-size: .75rem; padding: .25rem .6rem; border-radius: 5px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--text-dim);
  }
  .agent-card .ft button.go { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .agent-card .ft button:disabled { opacity: .5; cursor: default; }
  .agent-card.done { opacity: .72; }
</style>
</head>
<body>
<div class="app">

  <header class="bar">
    <div class="brand">xiray<span>AI 问答</span></div>
    <div class="actions">
      <span class="chip" id="modelChip">—</span>
      <span class="status" id="status">就绪</span>
      <div class="seg" id="modeSeg">
        <button id="modeChat" class="active" title="普通问答">对话</button>
        <button id="modeAgent" title="让 AI 直接改文章（要在写作台的小窗里用）">Agent</button>
      </div>
      <button class="ghost" id="sizeBtn" title="切换整页 / 小窗">小窗</button>
      <button class="ghost" id="clearBtn">清空</button>
      <button class="ghost" id="setBtn">设置</button>
    </div>
  </header>

  <main class="chat" id="chatScroll">
    <div class="empty" id="empty">
      <h1>问点什么</h1>
      <p>本地直连模型接口，API Key 只存在这台机器上。</p>
      <div class="chips">
        <button data-q="帮我解释一下 CORS 预检请求是怎么回事">解释一个技术概念</button>
        <button data-q="下面这段代码有问题，帮我看看：&#10;&#10;```js&#10;for (var i = 0; i < 3; i++) setTimeout(() => console.log(i), 0)&#10;```">帮我看看代码</button>
        <button data-q="我在写一篇关于本地静态博客的技术文章，帮我想 5 个不落俗套的选题">想几个选题</button>
        <button data-q="把这句改得更简洁有力：「由于最近一段时间以来，我们对整个系统进行了相应的重构工作」">润色一句话</button>
      </div>
    </div>
    <div class="thread" id="thread"></div>
  </main>

  <footer class="composer">
    <div class="box">
      <div class="ref-chip" id="refChip" hidden>
        <span class="ico">📄</span>
        <span class="nm" id="refName"></span>
        <span class="sz" id="refSize"></span>
        <button id="refClear" title="不引用这篇">×</button>
      </div>
      <textarea id="input" rows="1" placeholder="问点什么…"></textarea>
      <div class="row">
        <div class="row-left">
          <button class="ref-btn" id="refBtn" title="让 AI 读一篇博客文章">📄 <span class="lbl">引用文章</span></button>
          <span class="hint" id="hint">Enter 发送 · Shift+Enter 换行</span>
        </div>
        <button class="primary" id="sendBtn">发送</button>
      </div>
      <div class="ref-pop" id="refPop" hidden>
        <div class="rp-head">
          <input id="refSearch" spellcheck="false" placeholder="搜标题 / 类别…">
        </div>
        <div class="ref-list" id="refList"></div>
        <div class="rp-foot" id="refFoot">选一篇，AI 会读全文再回答</div>
      </div>
    </div>
  </footer>
</div>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer">
  <header>
    <span>模型设置</span>
    <button class="sm" id="closeDrawer">关闭</button>
  </header>
  <div class="inner">
    <div class="field">
      <label>接口地址（Base URL）</label>
      <input id="fBase" spellcheck="false" placeholder="https://api.deepseek.com">
      <div class="tip">官方填 <code>https://api.deepseek.com</code>（带不带 <code>/v1</code> 都行）。换别家兼容 OpenAI 的服务就改这里。</div>
    </div>
    <div class="field">
      <label>模型</label>
      <input id="fModel" list="modelList" spellcheck="false" placeholder="deepseek-chat">

    </div>

      <label>API Key</label>
      <input id="fKey" type="password" spellcheck="false" autocomplete="off" placeholder="sk-…">

    </div>

      Key 存在 <code>tools/.ai-config.json</code>，已加进 <code>.gitignore</code>，不会提交也不会推到线上。
      请求由本地服务代发，浏览器拿不到 Key。
    </div>
  </div>
</aside>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };

  var el = {
    chat: $("chatScroll"), thread: $("thread"), empty: $("empty"),
    input: $("input"), send: $("sendBtn"), status: $("status"),
    chip: $("modelChip"), hint: $("hint"),
    drawer: $("drawer"), scrim: $("scrim"), setBtn: $("setBtn"),
    closeDrawer: $("closeDrawer"),
    fBase: $("fBase"), fModel: $("fModel"), fKey: $("fKey"),
    modelList: $("modelList"), saveBtn: $("saveBtn"), fetchModels: $("fetchModels"),
    drawerMsg: $("drawerMsg"), keyTip: $("keyTip"),
    clearBtn: $("clearBtn"), sizeBtn: $("sizeBtn"),
    refBtn: $("refBtn"), refPop: $("refPop"), refList: $("refList"),
    refSearch: $("refSearch"), refFoot: $("refFoot"),
    refChip: $("refChip"), refName: $("refName"), refSize: $("refSize"),
    refClear: $("refClear"),
    modeSeg: $("modeSeg"), modeChat: $("modeChat"), modeAgent: $("modeAgent")
  };

  /* ---------------- 模式：整页 / 小窗 / 内嵌 ----------------
     ?mini=1  小窗布局（独立弹窗或写作台内嵌都走这个）
     ?embed=1 被嵌在写作台悬浮窗里，切换按钮变成「全屏」 */
  var QS = new URLSearchParams(location.search);
  var isMini = QS.get("mini") === "1";
  var isEmbed = QS.get("embed") === "1";
  if (isMini) document.body.classList.add("mini");
  if (isEmbed) document.body.classList.add("embed");

  function openMiniWindow() {
    var w = 440;
    var h = Math.max(520, Math.min(780, (screen.availHeight || 900) - 120));
    var left = Math.max(0, (screen.availWidth || 1280) - w - 48);
    var win = window.open("/ai?mini=1", "xiray-ai-mini",
      "width=" + w + ",height=" + h + ",left=" + left + ",top=" + 72 +
      ",resizable=yes,scrollbars=no");
    if (win) { try { win.focus(); } catch (e) {} }
  }

  function openFullWindow() {
    window.open("/ai", "_blank", "noopener");
  }

  if (isMini) {
    el.sizeBtn.textContent = "全屏";
    el.sizeBtn.title = "在新的整页标签里打开/继续这段对话";
    el.sizeBtn.addEventListener("click", openFullWindow);
  } else {
    el.sizeBtn.textContent = "小窗";
    el.sizeBtn.title = "开一个小窗口，摆在写作台旁边边问边写";
    el.sizeBtn.addEventListener("click", openMiniWindow);
  }
  if (isEmbed) el.sizeBtn.hidden = true;   // 嵌在写作台里时，外面的小窗自己有「全屏」

  var LS_MSG = "xiray.ai.messages";
  var LS_MODEL = "xiray.ai.model";
  var LS_AGENT = "xiray.ai.agent";

  /* Agent 模式：AI 直接改写作台里的文章。只能在写作台的小窗里用，
     因为它要拿到父窗口的编辑器，并且把改动落回去。 */
  var agentOn = false;
  try { agentOn = localStorage.getItem(LS_AGENT) === "1"; } catch (e) {}

  function agentReady() {
    return !!(window.parent && window.parent !== window &&
              window.parent.__XI_AGENT);
  }

  function setAgentMode(on) {
    agentOn = !!on;
    try { localStorage.setItem(LS_AGENT, agentOn ? "1" : "0"); } catch (e) {}
    el.modeChat.classList.toggle("active", !agentOn);
    el.modeAgent.classList.toggle("active", agentOn);
    document.body.classList.toggle("agent", agentOn);
    if (agentOn && !agentReady()) {
      setStatus("Agent 模式要在写作台的 AI 小窗里用", "err");
    } else {
      setStatus(agentOn ? "Agent 模式：AI 可以直接改文章" : "对话模式");
    }
    syncAutoRef();
    renderAll();
  }

  var cfg = { base_url: "", model: "", has_key: false, key_hint: "", config_path: "" };
  var messages = [];        // {role, content, reasoning?, ref?}
  var busy = false;
  var abort = null;
  var savedModels = [];

  /* 引用的文章：正文只留在这台机器的内存里，不进对话记录、不进 localStorage。
     每次请求作为 system 消息发一次，所以换文章对旧对话也立即生效。 */
  var attach = null;        // { slug, title, meta, text, truncated }
  var postsCache = null;
  var postsAt = 0;
  var REF_MAX = 30000;      // 单篇正文最多带这么多字符，超了截断并说明

  /* ---------------- 小工具 ---------------- */

  function setStatus(text, kind) {
    el.status.textContent = text || "";
    el.status.className = "status" + (kind ? " " + kind : "");
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function store(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
  }
  function restore(k, d) {
    try {
      var s = localStorage.getItem(k);
      return s ? JSON.parse(s) : d;
    } catch (e) { return d; }
  }

  /* ---------------- Markdown 渲染（够用就好，不引库） ---------------- */

  function inline(text) {
    var s = esc(text);
    // 行内代码先抽出来，避免里面的字符被后面的规则改坏
    var codes = [];
    s = s.replace(/`([^`\n]+)`/g, function (m, c) {
      codes.push("<code>" + c + "</code>");
      return "\u0000C" + (codes.length - 1) + "\u0000";
    });
    s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\u0000C(\d+)\u0000/g, function (m, i) { return codes[Number(i)]; });
    return s;
  }

  function mdToHtml(md) {
    // Agent 区块：藏掉标记行和 op/summary 这些头部字段，只把里面的正文当 markdown 渲染，
    // 这样气泡里看到的是一段正常的改动内容，看不到机器格式。
    var src = String(md).replace(
      /\[\[\s*WRITER[\s-]*AGENT\s*\]\]([\s\S]*?)(?:\[\[\s*\/\s*WRITER[\s-]*AGENT\s*\]\]|$)/gi,
      function (all, inner) {
        var k = inner.search(/^[ \t]*-{3,}[ \t]*$/m);
        var body = k >= 0 ? inner.slice(k).replace(/^[ \t]*-{3,}[ \t]*\n?/, "") : "";
        body = body.replace(/^\s*\n+/, "").replace(/\s+$/, "");
        return body ? "\n\n" + body + "\n\n" : "\n\n";
      }
    );
    var lines = src.replace(/\r\n?/g, "\n").split("\n");
    var out = [];
    var i = 0;

    function isBlockStart(line) {
      return /^\s*$/.test(line) || /^```/.test(line) || /^#{1,6}\s/.test(line) ||
        /^\s*[-*+]\s+/.test(line) || /^\s*\d+\.\s+/.test(line) ||
        /^>\s?/.test(line) || /^(---|\*\*\*|___)\s*$/.test(line);
    }

    while (i < lines.length) {
      var line = lines[i];

      if (/^\s*$/.test(line)) { i++; continue; }

      var fence = line.match(/^```([\w+-]*)\s*$/);
      if (fence) {
        var lang = fence[1] || "";
        var buf = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push('<div class="code-wrap"><button class="cp" type="button">复制</button>' +
          '<pre><code' + (lang ? ' data-lang="' + esc(lang) + '"' : "") + ">" +
          esc(buf.join("\n")) + "</code></pre></div>");
        continue;
      }

      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        var lv = Math.min(h[1].length + 1, 6);   // # 当二级标题用，跟站点文章一致
        out.push("<h" + lv + ">" + inline(h[2].trim()) + "</h" + lv + ">");
        i++;
        continue;
      }

      if (/^(---|\*\*\*|___)\s*$/.test(line)) { out.push("<hr>"); i++; continue; }

      if (/^>\s?/.test(line)) {
        var quote = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) {
          quote.push(lines[i].replace(/^>\s?/, ""));
          i++;
        }
        out.push("<blockquote>" + inline(quote.join("<br>")) + "</blockquote>");
        continue;
      }

      if (/^\s*[-*+]\s+/.test(line)) {
        var ul = [];
        while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
          ul.push("<li>" + inline(lines[i].replace(/^\s*[-*+]\s+/, "")) + "</li>");
          i++;
        }
        out.push("<ul>" + ul.join("") + "</ul>");
        continue;
      }

      if (/^\s*\d+\.\s+/.test(line)) {
        var ol = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          ol.push("<li>" + inline(lines[i].replace(/^\s*\d+\.\s+/, "")) + "</li>");
          i++;
        }
        out.push("<ol>" + ol.join("") + "</ol>");
        continue;
      }

      // 普通段落
      var para = [line];
      i++;
      while (i < lines.length && !isBlockStart(lines[i])) { para.push(lines[i]); i++; }
      out.push("<p>" + para.map(inline).join("<br>") + "</p>");
    }

    return out.join("\n");
  }

  /* ---------------- 渲染 ---------------- */

  function renderAll() {
    el.thread.innerHTML = "";
    el.empty.hidden = messages.length > 0;
    messages.forEach(function (m) {
      el.thread.appendChild(buildMessage(m));
    });
    scrollToBottom(true);
  }

  function buildMessage(m) {
    var wrap = document.createElement("div");
    wrap.className = "msg " + (m.role === "user" ? "user" : "ai");

    var who = document.createElement("div");
    who.className = "who";
    who.textContent = m.role === "user" ? "你" : "AI";
    wrap.appendChild(who);

    if (m.reasoning) wrap.appendChild(buildThink(m));

    if (m.role === "user" && m.ref && m.ref.title) {
      var tag = document.createElement("button");
      tag.type = "button";
      tag.className = "ref-tag";
      tag.textContent = "📄 " + m.ref.title;
      if (m.ref.slug) {
        // 刷新后正文已经不在内存里了，点一下按 slug 重新读
        tag.classList.add("again");
        tag.title = "点一下重新引用这篇";
        tag.addEventListener("click", function () { attachBySlug(m.ref.slug, m.ref.title); });
      } else {
        tag.title = m.ref.title;
      }
      wrap.appendChild(tag);
    }

    var body = document.createElement("div");
    body.className = "body";
    if (m.role === "user") body.textContent = m.content || "";
    else {
      body.innerHTML = mdToHtml(m.content || "");
      if (window.HL) HL.run(body);
    }

    if (m.error) {
      body.innerHTML = "";
      var box = document.createElement("div");
      box.className = "err-box";
      box.textContent = m.error;
      if (m.needConfig) {
        var b = document.createElement("button");
        b.className = "ghost sm";
        b.textContent = "去设置";
        b.addEventListener("click", openDrawer);
        box.appendChild(document.createElement("br"));
        box.appendChild(b);
      }
      body.appendChild(box);
    }

    wrap.appendChild(body);

    if (m.role === "assistant" && m.content && !m.error) {
      var tools = document.createElement("div");
      tools.className = "tools";
      var cp = document.createElement("button");
      cp.textContent = "复制";
      cp.addEventListener("click", function () {
        copyText(m.content);
        cp.textContent = "已复制";
        setTimeout(function () { cp.textContent = "复制"; }, 1200);
      });
      tools.appendChild(cp);
      wrap.appendChild(tools);

      var card = buildAgentCard(m);
      if (card) wrap.appendChild(card);
    }
    return wrap;
  }

  function buildThink(m) {
    var d = document.createElement("details");
    d.className = "think";
    if (m.reasoning && !m.done) d.open = true;
    var s = document.createElement("summary");
    s.textContent = "思考过程";
    var inner = document.createElement("div");
    inner.className = "inner";
    inner.textContent = m.reasoning || "";
    d.appendChild(s);
    d.appendChild(inner);
    return d;
  }

  /* ---------------- Agent 模式：解析并落改动 ---------------- */

  function agentCtx() {
    try {
      var a = window.parent && window.parent.__XI_AGENT;
      return a ? a.context() : null;
    } catch (e) { return null; }
  }

  function agentPrompt(c) {
    var text = String((c && c.text) || "").trim();
    var cut = text.length > REF_MAX ? text.slice(0, REF_MAX) : text;
    return "你是写作台里的文章编辑助手，可以直接改用户正在写的这篇文章。\n" +
      "当前文章：\n标题：" + ((c && c.title) || "（未命名）") + "\n" +
      "短名（slug）：" + ((c && c.slug) || "（还没定）") + "\n" +
      "类别：" + ((c && c.category) || "未分类") + "\n" +
      "日期：" + ((c && c.date) || "") + "\n" +
      "篇幅：约 " + text.length + " 字符\n" +
      (text ? "---------- 正文开始 ----------\n" + cut + "\n---------- 正文结束 ----------\n\n"
            : "（正文现在是空的）\n\n") +
      "你能执行的动作只有这五种：\n" +
      "1. {\"op\":\"set_meta\",\"title\":\"…\",\"excerpt\":\"…\",\"category\":\"…\",\"slug\":\"…\",\"date\":\"YYYY-MM-DD\"} 只写要改的字段\n" +
      "2. {\"op\":\"append_md\",\"md\":\"## 小节标题\\n\\n正文…\"} 在正文末尾追加一段 Markdown\n" +
      "3. {\"op\":\"replace_md\",\"md\":\"整篇新的 Markdown\"} 整篇重写，只有大改/润色全文时才用\n" +
      "4. {\"op\":\"open_post\",\"slug\":\"另一篇的短名\"} 换一篇来改\n" +
      "5. {\"op\":\"new_post\"} 新建空白草稿\n\n" +
      "输出格式必须严格遵守：\n" +
      "- 先用一两句中文说清你打算怎么改；\n" +
      "- 然后另起一行写 [[WRITER-AGENT]]，接着逐行写头部字段，写一行 --- 之后原样写 Markdown 正文，" +
      "最后另起一行写 [[/WRITER-AGENT]]。\n" +
      "  示例：\n" +
      "[[WRITER-AGENT]]\n" +
      "op: append_md\n" +
      "summary: 补一节讲时间复杂度\n" +
      "---\n" +
      "## 时间复杂度\n" +
      "\n" +
      "每层递归处理 n 个字符，共 n 层，所以是 O(n²)。\n" +
      "[[/WRITER-AGENT]]\n" +
      "- 这个区块**不要**用代码块包起来，**不要**用 JSON；正文里的 ``` 代码块照常写，不会和它冲突；\n" +
      "- 正文里的代码块请在第一行写语言（```cpp / ```python / ```js 这样），写作台会自动上色；\n" +
      "- 正文里引号、反斜杠、箭头、缩进都原样写，不需要任何转义；\n" +
      "- op 只能是 append_md（末尾追加）/ replace_md（整篇重写）/ set_meta（改标题等）/ " +
      "open_post（换一篇来改）/ new_post（新建空白草稿）；\n" +
      "- set_meta 在 --- 前面写要改的字段：title / excerpt / category / slug / date；不需要正文就省掉 --- ；\n" +
      "- open_post 只写 slug: xxx；new_post 只写 op: new_post；\n" +
      "- 只动用户要求的那部分，不要顺手删他原来的内容；\n" +
      "- 不要自己发布、推送、删文章——改完等用户点「应用」。";
  }

  /* 解析（新格式：头部 key: value + --- + 正文原样） ---------------------
     以前要求模型输出 JSON，但代码里全是引号、反斜杠、换行，模型经常转义错，
     于是「Agent 输出的 JSON 没解析成功」——所以改成不用转义的纯文本格式，
     同时保留对旧 JSON 的兼容和兜底修复。 */

  function parseAgentKv(src) {
    var lines = String(src || "").replace(/\r\n?/g, "\n").split("\n");
    var head = {}, body = [], inBody = false, seen = 0;
    lines.forEach(function (l) {
      if (!inBody) {
        if (/^\s*-{3,}\s*$/.test(l)) { inBody = true; return; }
        var m = l.match(/^\s*([A-Za-z_][\w-]*)\s*[:：]\s*(.*)$/);
        if (m) { head[m[1].toLowerCase()] = m[2].trim(); seen++; return; }
        if (!l.trim() && !seen) return;        // 头部之前的空行，忽略
        inBody = true;                          // 头部到此结束，剩下的都是正文
        body.push(l);
        return;
      }
      body.push(l);
    });

    var md = body.join("\n").replace(/^\n+/, "").replace(/\s+$/, "");
    var op = String(head.op || "").toLowerCase().replace(/[\s-]+/g, "_");
    if (!op) {
      if (head.slug) op = "open_post";
      else if (md) op = "replace_md";
      else if (head.title || head.excerpt || head.category) op = "set_meta";
      else if (head.new_post !== undefined) op = "new_post";
    }
    if (!op) return null;

    var a = { op: op, summary: head.summary || head.note || "" };
    ["title", "excerpt", "category", "slug", "date"].forEach(function (k) {
      if (head[k]) a[k] = head[k];
    });
    if (md) a.md = md;
    if ((op === "append_md" || op === "replace_md") && !a.md) return null;
    if (op === "open_post" && !a.slug) return null;
    return a;
  }

  // JSON 兜底：模型偶尔还是给 JSON，或者给一段被转义坏的 JSON
  function parseJsonLoose(raw) {
    var s = String(raw || "").trim();
    if (!s) return null;
    var cands = [s];
    var i = s.indexOf("{"), j = s.lastIndexOf("}");
    if (i >= 0 && j > i) cands.push(s.slice(i, j + 1));

    function noTrail(t) { return t.replace(/,\s*([}\]])/g, "$1"); }
    // 字符串里的裸换行/制表符转义掉；非法转义（\d \. \s 之类）补一个反斜杠
    function fixEsc(t) {
      var out = "", inStr = false, escNext = false;
      for (var k = 0; k < t.length; k++) {
        var ch = t.charAt(k);
        if (escNext) { escNext = false; out += ch; continue; }
        if (ch === "\\") {
          var nx = t.charAt(k + 1);
          if (!inStr) { out += ch; escNext = true; continue; }
          if (nx && '"\\/bfnrtu'.indexOf(nx) >= 0) { out += ch; escNext = true; }
          else { out += "\\\\"; }
          continue;
        }
        if (ch === '"') { inStr = !inStr; out += ch; continue; }
        if (inStr && (ch === "\n" || ch === "\r" || ch === "\t")) {
          out += ch === "\t" ? "\\t" : "\\n";
          continue;
        }
        out += ch;
      }
      return out;
    }

    for (var c = 0; c < cands.length; c++) {
      var tries = [cands[c], noTrail(cands[c])];
      tries.push(fixEsc(cands[c]), fixEsc(noTrail(cands[c])),
        fixEsc(noTrail(cands[c]).replace(/[\u201c\u201d]/g, '"')));
      for (var t = 0; t < tries.length; t++) {
        try { return JSON.parse(tries[t]); } catch (e) {}
      }
    }
    return null;
  }

  function parseAgentPlan(text) {
    var s = String(text || ""), m;
    var acts = [], summary = "";

    // 1) 新格式
    var re = /\[\[\s*WRITER[\s-]*AGENT\s*\]\]([\s\S]*?)(?:\[\[\s*\/\s*WRITER[\s-]*AGENT\s*\]\]|$)/gi;
    while ((m = re.exec(s))) {
      var a = parseAgentKv(m[1]);
      if (a) { if (!summary && a.summary) summary = a.summary; acts.push(a); }
    }
    if (acts.length) return { actions: acts, summary: summary };

    // 2) 旧格式：```writer-agent + JSON
    var raws = [];
    var fre = /```(?:writer-agent|writer|agent)\s*\n([\s\S]*?)```/gi;
    while ((m = fre.exec(s))) raws.push(m[1]);
    if (!raws.length) {
      var j = s.match(/\{[\s\S]*"actions"[\s\S]*\}/);
      if (j) raws.push(j[0]);
    }
    raws.forEach(function (raw) {
      var t = String(raw).trim();
      // 以 { 开头的基本都是旧 JSON，先按 JSON 解析；解析不出来的再交给 KV
      if (t.charAt(0) === "{") {
        var plan = parseJsonLoose(t);
        if (plan && Array.isArray(plan.actions)) {
          if (!summary && plan.summary) summary = plan.summary;
          plan.actions.forEach(function (x) { if (x && x.op) acts.push(x); });
          return;
        }
      }
      var kv = parseAgentKv(raw);
      if (kv) {
        if (!summary && kv.summary) summary = kv.summary;
        acts.push(kv);
      }
    });
    if (acts.length) return { actions: acts, summary: summary };

    if (raws.length || /\[\[\s*WRITER[\s-]*AGENT\s*\]\]/i.test(s)) return { bad: true };
    return null;
  }

  function humanizeOp(a) {
    var op = (a && a.op) || "";
    if (op === "set_meta") {
      var bits = [];
      if (a.title) bits.push("标题改成「" + a.title + "」");
      if (a.excerpt) bits.push("摘要改成「" + String(a.excerpt).slice(0, 24) + "」");
      if (a.category) bits.push("类别改成「" + a.category + "」");
      if (a.slug) bits.push("短名改成 " + a.slug);
      if (a.date) bits.push("日期改成 " + a.date);
      return bits.length ? bits.join("，") : "元信息（没给具体字段）";
    }
    if (op === "append_md") return "末尾追加一段 · " + String(a.md || "").length + " 字符";
    if (op === "replace_md") return "整篇正文重写 · " + String(a.md || "").length + " 字符";
    if (op === "open_post") return "打开文章 " + (a.slug || "");
    if (op === "new_post") return "新建空白草稿";
    return "不认识的动作：" + op;
  }

  function buildAgentCard(m) {
    var plan = parseAgentPlan(m.content);
    if (!plan) return null;
    if (plan.bad) {
      var bad = document.createElement("div");
      bad.className = "agent-card";
      var bhd = document.createElement("div");
      bhd.className = "hd";
      bhd.textContent = "这次的格式没读懂，没能生成可应用的改动";
      bad.appendChild(bhd);
      var bops = document.createElement("div");
      bops.className = "ops";
      bops.textContent = "可以让它按 writer-agent 格式重发一次（正文里的引号和反斜杠不用转义）。";
      bad.appendChild(bops);
      var bft = document.createElement("div");
      bft.className = "ft";
      var again = document.createElement("button");
      again.className = "go";
      again.textContent = "让它重来一次";
      again.addEventListener("click", function () {
        if (busy) return;
        again.disabled = true;
        el.input.value = "上一条的格式没读懂。请严格按 [[WRITER-AGENT]] … [[/WRITER-AGENT]] 的格式重新输出一次，" +
          "正文原样写、不要转义、不要用 JSON。";
        autoGrow();
        send();
      });
      bft.appendChild(again);
      bad.appendChild(bft);
      return bad;
    }
    var acts = Array.isArray(plan.actions) ? plan.actions : [];
    if (!acts.length) return null;

    var card = document.createElement("div");
    card.className = "agent-card";
    var hd = document.createElement("div");
    hd.className = "hd";
    hd.textContent = "✎ 准备改这篇文章" + (plan.summary ? " · " + plan.summary : "");
    card.appendChild(hd);

    var ul = document.createElement("ul");
    ul.className = "ops";
    acts.forEach(function (a) {
      var li = document.createElement("li");
      li.textContent = humanizeOp(a);
      ul.appendChild(li);
    });
    card.appendChild(ul);

    var ft = document.createElement("div");
    ft.className = "ft";
    var go = document.createElement("button");
    go.className = "go";
    go.textContent = "应用到编辑器";
    var undo = document.createElement("button");
    undo.textContent = "撤销";
    undo.hidden = true;
    var skip = document.createElement("button");
    skip.textContent = "忽略";

    go.addEventListener("click", function () {
      var api = window.parent && window.parent.__XI_AGENT;
      if (!api) { setStatus("只有写作台里的小窗能应用改动", "err"); return; }
      var res = api.apply(acts);
      if (!res || !res.ok) {
        setStatus("应用失败：" + ((res && res.error) || "未知原因"), "err");
        return;
      }
      card.classList.add("done");
      go.disabled = true;
      go.textContent = "已应用";
      skip.hidden = true;
      undo.hidden = false;
      setStatus("已应用：" + (res.applied || []).join("，"), "ok");
      syncAutoRef();
    });
    undo.addEventListener("click", function () {
      var api = window.parent && window.parent.__XI_AGENT;
      if (api && api.undo()) { undo.hidden = true; go.disabled = false; go.textContent = "再应用一次"; }
      syncAutoRef();
    });
    skip.addEventListener("click", function () {
      card.classList.add("done");
      go.disabled = true; skip.disabled = true;
    });

    ft.appendChild(go); ft.appendChild(undo); ft.appendChild(skip);
    card.appendChild(ft);
    return card;
  }

  function copyText(t) {    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).catch(fallbackCopy);

      var ta = document.createElement("textarea");
      ta.value = t;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }
  }

  /* ---------------- 引用文章 ----------------
     让 AI 能读博客里的文章：选中后正文作为 system 消息随每次请求带上。
     正文只存在这一页的内存里，不写进对话记录，也不进 localStorage。 */

  var draftCache = null;    // 写作台里草稿的快照，每次打开面板重取一次

  // 富文本 HTML → 纯文本，保留段落、代码块、表格的骨架
  function domToText(html) {
    var doc = new DOMParser().parseFromString("<div>" + String(html || "") + "</div>", "text/html");
    var root = doc.body.firstChild;
    if (!root) return "";
    var out = [];
    (function walk(n) {
      if (n.nodeType === 3) { out.push(n.nodeValue); return; }
      if (n.nodeType !== 1) return;
      var cls = n.getAttribute ? (n.getAttribute("class") || "") : "";
      if (cls.indexOf("ic-name") >= 0) return;      // 图片卡片上的文件名只是编辑器装饰
      var tag = n.nodeName.toLowerCase();
      if (tag === "br") { out.push("\n"); return; }
      if (tag === "pre") {
        var pcode = n.querySelector("code");
        var plang = (n.getAttribute("data-lang") || (pcode && pcode.getAttribute("data-lang")) || "").trim();
        out.push("\n```" + plang + "\n" + (n.textContent || "").replace(/\u200b/g, "").replace(/\n+$/, "") + "\n```\n");
        return;
      }
      if (tag === "img") { out.push("![图片](" + (n.getAttribute("src") || "") + ")"); return; }
      if (tag === "hr") { out.push("\n---\n"); return; }
      var block = /^(p|div|h[1-6]|li|tr|blockquote|table|thead|tbody|ul|ol|section|figure|figcaption)$/.test(tag);
      if (block) out.push("\n");
      Array.prototype.forEach.call(n.childNodes, walk);
      if (tag === "td" || tag === "th") out.push(" | ");
      if (block) out.push("\n");
    })(root);
    return out.join("")
      .replace(/\u00a0/g, " ")
      .replace(/[ \t]+\n/g, "\n")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  // 被嵌在写作台里时，父窗口就是同一个服务上的写作页，可以直接要当前草稿
  function writerDraft() {
    try {
      if (window.parent === window) return null;
      var d = window.parent.document;
      var rich = d.getElementById("richEditor");
      var md = d.getElementById("mdEditor");
      if (!rich && !md) return null;
      var mdWrap = d.getElementById("mdWrap");
      var isMd = !!(mdWrap && mdWrap.classList.contains("show"));
      var text = isMd ? String((md && md.value) || "")
                      : domToText(rich ? rich.innerHTML : "");
      if (!text.trim()) return null;
      var t = d.getElementById("title");
      return { title: ((t && t.value) || "").trim() || "（未命名草稿）", text: text };
    } catch (e) { return null; }
  }

  /* 自动读取：在写作台小窗里不用手动点「引用文章」，
     默认就把当前正在写的这篇带上。手动引用优先；点了 × 就不再自动带。 */
  var autoRefOn = true;

  function syncAutoRef() {
    if (!isEmbed || !autoRefOn) return;
    if (attach && !attach.auto) return;          // 手动选的文章不动它
    var d = writerDraft();
    if (!d) {
      if (attach && attach.auto) setAttach(null);
      return;
    }
    var text = d.text, truncated = false;
    if (text.length > REF_MAX) { text = text.slice(0, REF_MAX); truncated = true; }
    if (attach && attach.auto && attach.text === text && attach.title === d.title) return;
    setAttach({ slug: "", title: d.title, meta: "写作台正在写的这一篇",
                auto: true, text: text, truncated: truncated });
  }

  function refFootText() {
    if (!attach) { el.refFoot.textContent = "选一篇，AI 会读全文再回答"; return; }
    el.refFoot.textContent = "已引用 · " + attach.text.length.toLocaleString() + " 字符" +
      (attach.truncated ? "（原文更长，只带前面一部分）" : "");

  function setAttach(a) {

  function loadPosts(refresh) {
    if (postsCache && !refresh) return Promise.resolve(postsCache);
    return fetch("/api/posts", { cache: "no-store" })
      .then(function (r) { return r.json(); })

  function renderRefList() {
    var kw = el.refSearch.value.trim().toLowerCase();
    var hit = function (s) { return String(s || "").toLowerCase().indexOf(kw) >= 0; };

    var items = [];
    if (draftCache && (!kw || hit(draftCache.title) || hit(draftCache.text.slice(0, 400)))) {
      items.push({

        meta: "写作台里正在写的 · " + draftCache.text.length + " 字符",
        text: draftCache.text

    (postsCache || []).forEach(function (p) {
      if (kw && !(hit(p.title) || hit(p.category) || hit(p.date))) return;
      items.push({
        draft: false, slug: p.slug, title: p.title,
        meta: [p.date, p.category].filter(Boolean).join(" · ")

        '<span class="m">' + esc(it.meta || "") + "</span>";

      el.refList.appendChild(b);

  }

  function applyAttach(title, text, meta, slug) {
    var truncated = false;
    if (text.length > REF_MAX) { text = text.slice(0, REF_MAX); truncated = true; }
    setAttach({ slug: slug || "", title: title, meta: meta || "", text: text, truncated: truncated });
    setStatus("已引用 " + (title.length > 14 ? title.slice(0, 14) + "…" : title) +
      (truncated ? "（太长，已截断）" : ""), "ok");
    el.input.focus();

  function attachBySlug(slug, fallbackTitle) {
    if (!slug) return;
    el.refBtn.disabled = true;
    setStatus("正在读取「" + (fallbackTitle || slug) + "」…");
    return fetch("/api/post?slug=" + encodeURIComponent(slug), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        el.refBtn.disabled = false;
        if (!res.ok) throw new Error(res.error || "读取失败");
        var p = res.post || {};
        var raw = p.source || p.body_html || "";
        var text = (p.mode === "md") ? String(raw) : domToText(raw);
        if (!text.trim()) throw new Error("这篇的正文是空的");
        applyAttach(p.title || fallbackTitle || slug, text,
          [p.date, p.category].filter(Boolean).join(" · ")
          + (p.mode === "md" ? " · Markdown" : ""),
          p.slug || slug);
      })
      .catch(function (e) {
        el.refBtn.disabled = false;
        setStatus("读取失败：" + String((e && e.message) || e), "err");
      });
  }

  function pickRef(it) {
    closeRef();
    if (it.draft) { applyAttach(it.title, it.text, "写作台草稿", ""); return; }
    attachBySlug(it.slug, it.title);
  }

  function refPrompt(a) {
    return "用户从自己的博客里引用了下面这篇文章，当作参考资料来读。" +
      "回答相关问题时以文中内容为准；引用原文用「」标出，不要编造文中没有的说法；" +
      "如果问题和这篇文章无关，就正常回答，不用硬往文章上靠。\n\n" +
      "标题：" + a.title + "\n" +
      (a.meta ? "信息：" + a.meta + "\n" : "") +
      "篇幅：约 " + a.text.length + " 字符" +
      (a.truncated ? "（原文更长，以下只是前面一部分）" : "") + "\n" +
      "---------- 正文开始 ----------\n" + a.text + "\n---------- 正文结束 ----------";
  }

  /* ---------------- 发送 ---------------- */

  function autoGrow() {
    el.input.style.height = "auto";
    el.input.style.height = Math.min(el.input.scrollHeight, 192) + "px";
  }

  function setBusy(on) {
    busy = on;
    el.send.textContent = on ? "停止" : "发送";
    el.send.className = on ? "ghost" : "primary";
  }

  function send() {
    if (busy) { stop(); return; }
    var text = el.input.value.trim();
    // 选好了文章但没打字：默认让它梳理这篇
    if (!text && attach) text = "这篇文章讲了什么？帮我梳理一下要点。";
    if (!text) return;

    messages.push({
      role: "user", content: text,
      ref: attach ? { title: attach.title, slug: attach.slug || "" } : null
    });
    var aiMsg = { role: "assistant", content: "", reasoning: "", done: false };
    messages.push(aiMsg);
    el.input.value = "";
    autoGrow();
    renderAll();
    setBusy(true);
    setStatus("请求中…");

    var node = el.thread.lastChild;
    var bodyEl = node.querySelector(".body");
    var thinkEl = null;
    var t0 = Date.now();

    function paint() {
      bodyEl.innerHTML = mdToHtml(aiMsg.content);
      if (window.HL) HL.run(bodyEl);      // 流式重渲染后要重新上色
      bodyEl.classList.add("typing");
      if (thinkEl) {
        thinkEl.querySelector(".inner").textContent = aiMsg.reasoning;
      }
      scrollToBottom();
    }

    function ensureThink() {
      if (thinkEl) return;
      var d = document.createElement("details");
      d.className = "think";
      d.open = true;
      d.innerHTML = '<summary>思考过程</summary><div class="inner"></div>';
      node.insertBefore(d, bodyEl);
      thinkEl = d;
    }

    abort = new AbortController();
    var history = [];
    // 引用的文章放在最前面，每轮都带一次：中途换文章，旧对话也立刻按新文章来。
    // Agent 模式下换成「文章 + 可执行动作」的说明，让它能直接动文章。
    syncAutoRef();
    var ag = (agentOn && agentReady()) ? agentCtx() : null;
    if (ag) history.push({ role: "system", content: agentPrompt(ag) });
    else if (attach) history.push({ role: "system", content: refPrompt(attach) });
    messages.filter(function (m) { return !m.error && (m.content || ""); })
      .forEach(function (m) { history.push({ role: m.role, content: m.content }); });

    fetch("/api/ai/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history, model: cfg.model }),
      signal: abort.signal
    }).then(function (resp) {
      var ct = resp.headers.get("Content-Type") || "";
      if (ct.indexOf("text/event-stream") < 0) {
        return resp.json().then(function (res) {
          throw new Error((res.need_config ? "__CFG__" : "") + (res.error || "请求失败"));
        });
      }
      var reader = resp.body.getReader();
      var dec = new TextDecoder("utf-8");
      var buf = "";

      function pump() {
        return reader.read().then(function (r) {
          if (r.done) return finish();
          buf += dec.decode(r.value, { stream: true });
          var parts = buf.split("\n\n");
          buf = parts.pop();
          for (var k = 0; k < parts.length; k++) {
            var line = parts[k].trim();
            if (line.indexOf("data:") !== 0) continue;
            var obj;
            try { obj = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }
            handle(obj);
          }
          return pump();
        });
      }

      function handle(obj) {
        if (obj.type === "meta") {
          setStatus("生成中 · " + (obj.route || "直连"));
        } else if (obj.type === "delta") {
          aiMsg.content += obj.text;
          paint();
        } else if (obj.type === "reason") {
          aiMsg.reasoning += obj.text;
          ensureThink();
          paint();
        } else if (obj.type === "reason_end") {
          if (thinkEl) thinkEl.open = false;
        } else if (obj.type === "error") {
          fail(obj.error || "上游出错");
        } else if (obj.type === "done") {
          finish();
        }
      }

      function finish() {
        if (aiMsg.done) return;
        aiMsg.done = true;
        bodyEl.classList.remove("typing");
        setBusy(false);
        // 回答里的代码块如果没标语言，让它自己认一下（流式结束了再问，避免反复请求）
        if (window.AILang) AILang.detect(bodyEl);
        var secs = ((Date.now() - t0) / 1000).toFixed(1);
        if (aiMsg.content) {
          setStatus(messages.length / 2 + " 轮 · " + secs + " 秒", "ok");
          var tools = document.createElement("div");
          tools.className = "tools";
          var cp = document.createElement("button");
          cp.textContent = "复制";
          cp.addEventListener("click", function () {
            copyText(aiMsg.content);
            cp.textContent = "已复制";
            setTimeout(function () { cp.textContent = "复制"; }, 1200);
          });
          tools.appendChild(cp);
          node.appendChild(tools);

          // 流式结束后才解析 writer-agent 块：增量渲染时内容还不完整
          var card = buildAgentCard(aiMsg);
          if (card) {
            node.appendChild(card);
            scrollToBottom();
          } else if (agentOn) {
            setStatus("这轮没有可应用的改动（没找到 writer-agent 块）", "err");
          }
        } else if (!aiMsg.error) {
          aiMsg.error = "模型没有返回任何内容。可能模型名不对，或该模型不支持流式输出。";
          bodyEl.innerHTML = "";
          var box = document.createElement("div");
          box.className = "err-box";
          box.textContent = aiMsg.error;
          bodyEl.appendChild(box);
          setStatus("没有输出", "err");
        }
        persist();
        scrollToBottom();
      }

      function fail(msg) {
        aiMsg.error = msg;
        aiMsg.done = true;
        bodyEl.classList.remove("typing");
        bodyEl.innerHTML = "";
        var box = document.createElement("div");
        box.className = "err-box";
        box.textContent = msg;
        if (msg.indexOf("__CFG__") >= 0 || msg.indexOf("API Key") >= 0) {
          aiMsg.needConfig = true;
          box.textContent = msg.replace("__CFG__", "");
          var b = document.createElement("button");
          b.className = "ghost sm";
          b.textContent = "去设置";
          b.addEventListener("click", openDrawer);
          box.appendChild(document.createElement("br"));
          box.appendChild(b);
        }
        bodyEl.appendChild(box);
        setBusy(false);
        setStatus("失败", "err");
        persist();
      }

      return pump();
    }).catch(function (e) {
      if (e && e.name === "AbortError") {
        aiMsg.done = true;
        bodyEl.classList.remove("typing");
        setBusy(false);
        setStatus("已停止");
        persist();
        return;
      }
      aiMsg.error = String((e && e.message) || e).replace("__CFG__", "");
      aiMsg.done = true;
      bodyEl.classList.remove("typing");
      bodyEl.innerHTML = "";
      var box = document.createElement("div");
      box.className = "err-box";
      box.textContent = aiMsg.error;
      bodyEl.appendChild(box);
      setBusy(false);
      setStatus("失败", "err");
      persist();
    });
  }

  function stop() {
    if (abort) { try { abort.abort(); } catch (e) {} }
  }

  function persist() {
    store(LS_MSG, messages.filter(function (m) { return !m.error; }).map(function (m) {
      return { role: m.role, content: m.content, ref: m.ref || undefined };
    }));
  }

  /* ---------------- 事件 ---------------- */

  el.send.addEventListener("click", send);
  el.input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  el.input.addEventListener("input", autoGrow);

  el.setBtn.addEventListener("click", openDrawer);
  el.closeDrawer.addEventListener("click", closeDrawer);
  el.scrim.addEventListener("click", closeDrawer);
  el.saveBtn.addEventListener("click", saveConfig);
  el.fetchModels.addEventListener("click", fetchModels);

  /* ---- 对话 / Agent ---- */
  el.modeChat.addEventListener("click", function () { setAgentMode(false); });
  el.modeAgent.addEventListener("click", function () {
    if (!agentReady()) {
      setStatus("Agent 模式要在写作台的 AI 小窗里用（外面没有文章可改）", "err");
      return;
    }
    setAgentMode(true);
  });
  el.input.addEventListener("focus", syncAutoRef);

  /* ---- 引用文章：按钮开关面板，点外面 / Esc 收起 ---- */
  el.refBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (el.refPop.hidden) openRef(); else closeRef();
  });
  el.refPop.addEventListener("click", function (e) { e.stopPropagation(); });
  el.refSearch.addEventListener("input", renderRefList);
  el.refSearch.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      var first = el.refList.querySelector(".ref-item");
      if (first) first.click();
    }
  });
  el.refClear.addEventListener("click", function () {
    setAttach(null);
    setStatus("已取消引用");
  });
  document.addEventListener("click", function () {
    if (!el.refPop.hidden) closeRef();
  });

  el.clearBtn.addEventListener("click", function () {
    if (busy) return;
    if (messages.length && !confirm("清空当前对话？")) return;
    messages = [];
    el.thread.innerHTML = "";
    el.empty.hidden = false;
    store(LS_MSG, []);
    setAttach(null);
    setStatus("已清空");
  });

  el.thread.addEventListener("click", function (e) {
    var btn = e.target.closest(".cp");
    if (!btn) return;
    var code = btn.parentNode.querySelector("code");
    if (!code) return;
    copyText(code.textContent);
    btn.textContent = "已复制";
    setTimeout(function () { btn.textContent = "复制"; }, 1200);
  });

  el.empty.addEventListener("click", function (e) {
    var b = e.target.closest("[data-q]");
    if (!b) return;
    el.input.value = b.getAttribute("data-q");
    autoGrow();
    el.input.focus();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeDrawer(); closeRef(); }
    if ((e.ctrlKey || e.metaKey) && e.key === "l") {
      e.preventDefault();
      el.clearBtn.click();
    }
  });

  /* ---------------- 启动 ---------------- */

  var saved = restore(LS_MSG, []);
  if (Array.isArray(saved) && saved.length) {
    messages = saved.map(function (m) {
      return { role: m.role, content: m.content, ref: m.ref, done: true };
    });
  }
  renderAll();
  autoGrow();
  if (agentOn) setAgentMode(true);      // 恢复上次的模式（也在里面同步自动引用）
  else syncAutoRef();
  loadConfig().then(function (res) {
    if (res && res.ok) {
      var c = res.config;
      if (!c.has_key) {
        setStatus("还没配 API Key", "err");
        openDrawer();
      } else {
        setStatus("就绪");
      }
    }
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写作台 — xiray</title>
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="/assets/style.css?v=20261025b">
<script>window.__HL_MANUAL__ = true;</script>
<script src="/assets/hl.js?v=20261025b"></script>
<script src="/assets/ai-lang.js?v=20261025b"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%23ffb86b'/></svg>">
<style>
  html, body { height: 100%; overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100vh; }

  /* ================= 顶栏 ================= */
  .bar {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; padding: 0 1rem; height: 3.25rem;
    border-bottom: 1px solid var(--line); background: var(--bg-soft);
  }
  .bar .brand { font-family: var(--serif); font-size: 1rem; font-weight: 600; white-space: nowrap; }
  .bar .brand span {
    color: var(--muted); font-family: var(--sans); font-size: .8125rem;
    font-weight: 400; margin-left: .5rem; letter-spacing: .08em;
  }
  .bar .actions { display: flex; align-items: center; gap: .625rem; }

  .status {
    font-size: .8125rem; color: var(--muted); max-width: 24rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .status.ok { color: #6ee7a8; }
  .status.err { color: #ff8f8f; }

  button {
    font: inherit; font-size: .875rem; padding: .4rem .9rem; border-radius: 6px;
    cursor: pointer; transition: all .15s ease; border: 1px solid transparent;
    background: transparent; color: var(--text-dim);
  }
  button:hover { color: var(--text); }
  button.ghost { border-color: var(--line); }
  button.ghost:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: #1a1206; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); color: #1a1206; }
  button:disabled { opacity: .5; cursor: default; filter: none; }

  .seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; padding: .35rem .8rem; font-size: .8125rem; color: var(--muted); }
  .seg button.active { background: var(--bg-soft); color: var(--accent); font-weight: 600; }

  /* ================= 主体 ================= */
  .body { flex: 1 1 auto; display: grid; grid-template-columns: 14.5rem minmax(0, 1fr); min-height: 0; }

  /* ---- 侧栏 ---- */
  .side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--bg-soft); }
  .side-head {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    padding: .75rem .9rem .5rem; font-size: .6875rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted);
  }
  .post-items { flex: 1 1 auto; overflow-y: auto; list-style: none; margin: 0; padding: 0 .4rem .5rem; }
  .post-items li {
    position: relative; padding: .5rem .55rem; border-radius: 6px; cursor: pointer;
    display: flex; flex-direction: column; gap: .15rem; transition: background .15s ease;
  }
  .post-items li:hover { background: var(--bg); }
  .post-items li.active { background: var(--bg); box-shadow: inset 2px 0 0 var(--accent); }
  .post-items .pi-title {
    font-size: .8125rem; color: var(--text-dim); line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; padding-right: 1.4rem;
  }
  /* 选中的那篇不裁：长标题（比如 LeetCode 19 那种）要能看全 */
  .post-items li.active .pi-title {
    display: block; overflow: visible; -webkit-line-clamp: none;
  }
  .post-items li.active .pi-title { color: var(--text); }
  .post-items .pi-meta {
    font-family: var(--mono); font-size: .625rem; color: var(--muted);
    letter-spacing: .04em; display: flex; gap: .4rem;
  }
  .post-items .pi-del {
    position: absolute; right: .3rem; top: .45rem; width: 1.35rem; height: 1.35rem;
    padding: 0; display: none; align-items: center; justify-content: center;
    border-radius: 4px; font-size: .75rem; color: var(--muted); line-height: 1;
  }
  .post-items li:hover .pi-del { display: flex; }
  .post-items .pi-del:hover { color: #ff8f8f; background: rgba(255,90,90,.12); }
  .side-foot { flex: 0 0 auto; padding: .5rem .4rem .75rem; border-top: 1px solid var(--line-soft); }
  .side-foot button { width: 100%; border: 1px dashed var(--line); font-size: .8125rem; }
  .side-foot button.restore { margin-top: .4rem; border-style: solid; color: var(--muted); font-size: .75rem; }
  .side-foot button.restore:hover { color: var(--accent); border-color: var(--accent); }
  .side-empty { padding: 1rem .9rem; font-size: .75rem; color: var(--muted); }

  /* 侧栏「拉取」：比正文小一号，别抢「更新/发布」的注意力 */
  .side-tools { display: flex; align-items: center; gap: .45rem; }
  .side-tools .mini {
    padding: .1rem .45rem; font-size: .6875rem; letter-spacing: .04em;
    text-transform: none; color: var(--muted); border: 1px solid var(--line);
    border-radius: 4px; line-height: 1.5;
  }
  .side-tools .mini:hover { color: var(--accent); border-color: var(--accent); }
  .side-tools .mini[disabled] { opacity: .5; cursor: default; }

  /* 找回已删文章的浮层 */
  .restore-pop {
    position: fixed; z-index: 95; width: 21rem; max-height: 20rem; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 18px 40px rgba(0,0,0,.45); padding: .45rem;
  }
  .restore-pop[hidden] { display: none; }
  .restore-pop .rp-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: .2rem .35rem .45rem; font-size: .6875rem; color: var(--muted);
    letter-spacing: .08em;
  }
  .restore-pop .rp-item {
    display: flex; align-items: center; gap: .5rem; padding: .45rem .35rem;
    border-radius: 5px;
  }
  .restore-pop .rp-item:hover { background: var(--bg); }
  .restore-pop .rp-title {
    flex: 1 1 auto; min-width: 0; font-size: .8125rem; color: var(--text-dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .restore-pop .rp-date {
    flex: 0 0 auto; font-family: var(--mono); font-size: .625rem; color: var(--muted);
  }
  .restore-pop .rp-go {
    flex: 0 0 auto; padding: .15rem .5rem; font-size: .6875rem;
    border: 1px solid var(--line); border-radius: 4px; color: var(--accent);
  }
  .restore-pop .rp-go:hover { border-color: var(--accent); }
  .restore-pop .rp-close {
    padding: 0 .2rem; font-size: .75rem; color: var(--muted); background: none;
    border: none; line-height: 1;
  }
  .restore-pop .rp-close:hover { color: var(--text); }

  /* ---- 右侧 ---- */
  .main { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--bg); }

  .fields { flex: 0 0 auto; padding: .9rem 1.5rem .6rem; display: grid; gap: .55rem; }
  input[type="text"], input[type="date"], select {
    font: inherit; background: transparent; border: none; border-bottom: 1px solid var(--line);
    color: var(--text); padding: .35rem 0; outline: none; width: 100%;
    transition: border-color .15s ease;
  }
  input[type="text"]:focus, input[type="date"]:focus, select:focus { border-bottom-color: var(--accent); }
  input::placeholder { color: var(--muted); opacity: .7; }
  #title {
    font-family: var(--serif); font-size: 1.45rem; font-weight: 600;
    letter-spacing: -.01em; border-bottom: none; padding: .15rem 0;
  }
  .meta-row { display: grid; grid-template-columns: 9.5rem 11rem minmax(0, 1fr); gap: 1rem; }
  .meta-row label, .field-label {
    display: block; font-size: .625rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: .1rem;
  }
  input[type="date"] { font-family: var(--mono); font-size: .8125rem; color-scheme: dark; }
  select { font-size: .875rem; color-scheme: dark; }
  select option { background: var(--bg-soft); color: var(--text); }

  /* ---- 工具栏 ---- */
  .toolbar {
    flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: .2rem;
    padding: .4rem 1.5rem .5rem; border-bottom: 1px solid var(--line-soft);
  }
  .toolbar .tb {
    min-width: 1.9rem; height: 1.9rem; padding: 0 .4rem; border-radius: 5px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: .875rem; color: var(--text-dim); border: 1px solid transparent;
  }
  .toolbar .tb svg { display: block; }
  .toolbar .tb:hover { background: var(--bg-soft); color: var(--text); }
  .toolbar .tb.on { background: var(--bg-soft); color: var(--accent); border-color: var(--line); }
  .toolbar .sep { width: 1px; height: 1.25rem; background: var(--line); margin: 0 .35rem; }
  .toolbar select {
    border: 1px solid var(--line); border-radius: 5px; padding: .22rem .35rem;
    width: auto; font-size: .8125rem; background: var(--bg); color: var(--text-dim);
  }

  .color-btn {
    position: relative; width: 1.9rem; height: 1.9rem; border-radius: 5px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: .8125rem; color: var(--text-dim); overflow: hidden;
  }
  .color-btn:hover { background: var(--bg-soft); color: var(--text); }
  .color-btn input[type="color"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; border: none; }
  .color-btn .swatch {
    position: absolute; bottom: .22rem; left: 50%; transform: translateX(-50%);
    width: 1rem; height: .18rem; border-radius: 1px;
  }

  /* ---- 编辑区 ---- */
  .editor-area { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; }
  #richWrap { flex: 1 1 auto; overflow-y: auto; padding: 1.25rem 1.5rem 4rem; }
  #richEditor {
    max-width: 44rem; margin: 0 auto; min-height: 60vh; outline: none;
    font-size: 1.0625rem; line-height: 1.8;
  }
  /* 代码块统一：等宽、无连字、tab 按 4 格算（跟 VS Code 默认一致） */
  #richEditor pre, #mdPreview pre, #richEditor code, #mdPreview code {
    font-family: var(--mono); tab-size: 4;
    font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0;
  }
  #richEditor:empty::before {
    content: attr(data-ph); color: var(--muted); opacity: .6; pointer-events: none;
    font-family: var(--sans); font-size: .9375rem;
  }

  #mdWrap { flex: 1 1 auto; display: none; min-height: 0; }
  #mdWrap.show { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  #mdEditor {
    min-height: 0; width: 100%; resize: none; border: none; outline: none;
    /* Markdown 源码按代码编辑器的手感来：等宽 + 关掉连字 + tab 4，
       这样空格/缩进跟 VS Code 里看起来一致（中文恰好占两格） */
    background: var(--bg); color: var(--text-dim); font-family: var(--mono);
    font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0;
    font-size: .9375rem; line-height: 1.75; padding: 1.25rem 1.5rem 4rem; tab-size: 4;
    border-right: 1px solid var(--line-soft);
  }
  #mdPreview { overflow-y: auto; padding: 1.25rem 1.75rem 4rem; }
  #mdPreview .prose { max-width: 44rem; margin: 0 auto; }

  /* 编辑区内元素 */
  #richEditor table, #mdPreview table, .prose table { border-collapse: collapse; width: 100%; margin: 1.5em 0; font-size: .9375rem; }
  #richEditor th, #richEditor td, #mdPreview th, #mdPreview td, .prose th, .prose td {
    border: 1px solid var(--line); padding: .5rem .7rem; text-align: left;
  }
  #richEditor th, #mdPreview th, .prose th { background: var(--bg-soft); font-weight: 600; color: var(--text); }

  .attach {
    display: inline-flex; align-items: center; gap: .5rem; max-width: 100%;
    padding: .55rem .8rem; margin: .25rem 0; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg-soft); text-decoration: none !important;
    color: var(--text-dim) !important; font-size: .875rem; line-height: 1.4;
  }
  .attach:hover { border-color: var(--accent); color: var(--text) !important; }
  .attach .size { font-family: var(--mono); font-size: .6875rem; color: var(--muted); }

  /* ---- 正文图片：插入时先完整显示 2 秒，然后收成「xxx.png」小卡片 ----
     卡片底纹就是图片本身（压暗 + 轻模糊），一眼看出这是图，不是一段文字。
     这些样式只在编辑器里生效，Markdown 预览和线上文章照常显示大图。 */
  #richEditor .img-chip {
    display: inline-block; position: relative; max-width: 100%;
    vertical-align: middle; line-height: 0;
  }
  #richEditor .img-chip img {
    display: block; max-width: 100%; height: auto;
    border-radius: 7px; transition: opacity .18s ease;
  }
  #richEditor .img-chip .ic-name { display: none; }

  #richEditor .img-chip.collapsed {
    width: 11.5rem; height: 3.2rem; overflow: hidden; line-height: 1;
    border: 1px solid var(--line); border-radius: 7px; background: var(--bg-soft);
    cursor: zoom-in;
  }
  #richEditor .img-chip.collapsed img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: .42; filter: blur(1px) saturate(.85);
    border-radius: 0;
  }
  #richEditor .img-chip.collapsed::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(0, 0, 0, .45), rgba(0, 0, 0, .06));
  }
  #richEditor .img-chip.collapsed .ic-name {
    position: absolute; inset: 0; z-index: 1; display: flex; align-items: center;
    gap: .35rem; padding: 0 .5rem;
    font-family: var(--mono); font-size: .6875rem; color: #fff;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #richEditor .img-chip.collapsed .ic-name::before {
    content: "🖼"; font-size: .75rem; opacity: .9; flex: 0 0 auto;
  }
  #richEditor .img-chip:not(.collapsed) { cursor: zoom-out; }

  /* ---- 滚动条 ---- */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--line-soft); }

  @media (max-width: 68rem) {
    .body { grid-template-columns: minmax(0, 1fr); }
    .side { display: none; }
    .meta-row { grid-template-columns: 1fr 1fr; }
    .status { display: none; }
  }

  /* ================= AI 小窗（悬浮，可拖可缩放） ================= */
  .ai-dock {
    position: fixed; z-index: 60; display: flex; flex-direction: column;
    min-width: 320px; min-height: 240px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; box-shadow: 0 20px 56px rgba(0, 0, 0, .5);
  }
  .ai-dock[hidden] { display: none; }
  .ai-dock-bar {
    flex: 0 0 auto; height: 2.15rem; display: flex; align-items: center;
    justify-content: space-between; gap: .5rem; padding: 0 .3rem 0 .65rem;
    background: var(--bg-soft); border-bottom: 1px solid var(--line);
    cursor: grab; user-select: none; touch-action: none;
  }
  .ai-dock-bar:active { cursor: grabbing; }
  .ai-dock-title {
    font-family: var(--mono); font-size: .625rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted); white-space: nowrap;
  }
  .ai-dock-btns { display: flex; gap: .25rem; }
  .ai-dock-btns button {
    height: 1.45rem; padding: 0 .45rem; font-size: .6875rem; line-height: 1;
    color: var(--muted); border: 1px solid var(--line); border-radius: 4px;
  }
  .ai-dock-btns button:hover { color: var(--text); border-color: var(--muted); }
  .ai-dock iframe {
    flex: 1 1 auto; width: 100%; min-height: 0; border: none; background: var(--bg);
  }
  .ai-dock-grip {
    position: absolute; right: 1px; bottom: 1px; width: 15px; height: 15px;
    cursor: nwse-resize; z-index: 3; opacity: .55; border-radius: 2px;
    background:
      linear-gradient(-45deg, transparent 46%, var(--muted) 46%, var(--muted) 54%, transparent 54%)
      right bottom / 9px 9px no-repeat,
      linear-gradient(-45deg, transparent 46%, var(--muted) 46%, var(--muted) 54%, transparent 54%)
      right bottom / 5px 5px no-repeat;
  }
  .ai-dock-grip:hover { opacity: 1; }
  #aiBtn.on { border-color: var(--accent-dim); color: var(--accent); }

  /* 更新按钮上那个「攒了几个改动」的小数字 */
  #syncBtn .badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 1.05rem; height: 1.05rem; margin-left: .3rem; padding: 0 .28rem;
    border-radius: 999px; background: var(--accent); color: #1a1206;
    font-size: .625rem; font-weight: 700; line-height: 1; vertical-align: 1px;
  }
  #syncBtn .badge[hidden] { display: none; }
  #syncBtn.dirty { border-color: var(--accent-dim); color: var(--text); }

  /* 表格尺寸选择：点工具栏的表格按钮弹出来 */
  .tbl-pop {
    position: fixed; z-index: 70; padding: .5rem .55rem .42rem;
    background: var(--bg-soft); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, .45);
  }
  .tbl-pop[hidden] { display: none; }
  .tbl-grid { display: grid; grid-template-columns: repeat(8, 1.15rem); gap: 2px; }
  .tbl-cell {
    width: 1.15rem; height: 1.15rem; padding: 0; border-radius: 2px;
    border: 1px solid var(--line); background: transparent; cursor: pointer;
  }
  .tbl-cell:hover { border-color: var(--muted); }
  .tbl-cell.on { background: var(--accent); border-color: var(--accent); }
  .tbl-hint {
    margin-top: .35rem; text-align: center; font-family: var(--mono);
    font-size: .6875rem; color: var(--muted); white-space: nowrap;
  }
  .tbl-hint b { color: var(--accent); font-weight: 600; }

  /* 拖文件进来时的整屏提示 */
  .drop-mask {
    position: fixed; inset: 0; display: none; place-items: center; z-index: 90;
    background: rgba(10, 12, 15, .62); pointer-events: none; text-align: center;
  }
  .drop-mask.on { display: grid; }
  .drop-mask b { display: block; font-size: 1.15rem; color: #fff; }
  .drop-mask span { display: block; margin-top: .45rem; font-size: .8125rem; color: #c8ccd4; }

  /* 代理探测不通时的提示色 */
  .ghost.warn { color: #e0795f; border-color: rgba(224, 121, 95, .55); }

  /* 本地草稿和线上版不一致时的提示条 */
  .draft-bar {
    display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
    padding: .45rem 1.5rem; font-size: .75rem; color: var(--text-dim);
    background: rgba(255, 184, 107, .09);
    border-bottom: 1px solid rgba(255, 184, 107, .22);
  }
  .draft-bar[hidden] { display: none; }
  .draft-bar .grow { flex: 1 1 16rem; min-width: 0; line-height: 1.5; }
  .draft-bar b { color: var(--accent); font-weight: 600; }
  .draft-bar button {
    flex: 0 0 auto; padding: .15rem .55rem; font-size: .6875rem;
    border: 1px solid var(--line); border-radius: 4px; color: var(--text-dim);
  }
  .draft-bar button:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<div class="app">

  <header class="bar">
    <div class="brand">xiray<span>写作台</span></div>
    <div class="actions">
      <span class="status" id="status">就绪</span>
      <div class="seg">
        <button id="modeRich" class="active">富文本</button>
        <button id="modeMd">Markdown</button>
      </div>
      <button class="ghost" id="newBtn">新建</button>
      <button class="ghost" id="importBtn" title="导入本地 .md 文件（也可以直接把文件拖进来）">导入 md</button>
      <input type="file" id="mdPicker" accept=".md,.markdown,.txt" hidden>
      <button class="ghost" id="aiBtn" title="AI 小窗（Shift+点击另开整页）">AI 问答</button>
      <button class="ghost" id="proxyBtn" title="点一下在「走代理」和「直连」之间切换">代理</button>
      <button class="ghost" id="syncBtn" title="把本地改动一次性推到 GitHub">更新<span class="badge" id="syncBadge" hidden></span></button>
      <button class="primary" id="pubBtn">发布</button>
    </div>
  </header>

  <div class="body">

    <aside class="side">
      <div class="side-head">
        <span>文章</span>
        <span class="side-tools">
          <span id="postCount"></span>
          <button class="mini" id="pullBtn" title="从 GitHub 拉取最新内容（只快进，不会覆盖本地没推上去的改动）">拉取</button>
        </span>
      </div>
      <ul class="post-items" id="postItems"></ul>
      <div class="side-foot">
        <button id="newBtn2">＋ 新建文章</button>
        <button id="restoreBtn" class="restore" hidden>从历史找回<span id="restoreCount"></span></button>
      </div>
    </aside>

    <section class="main">

      <div class="draft-bar" id="draftBar" hidden>
        <span class="grow" id="draftBarText"></span>
        <button id="draftDisk">用线上版</button>
        <button id="draftKeep">保留草稿</button>
      </div>

      <div class="fields">

<input type="file" id="filePicker" style="display:none">

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  var el = {
    title: $("title"), date: $("date"), category: $("category"), slug: $("slug"),
    excerpt: $("excerpt"), status: $("status"), rich: $("richEditor"),
    md: $("mdEditor"), mdWrap: $("mdWrap"), mdPreview: $("mdPreview").querySelector(".prose"),
    richWrap: $("richWrap"), toolbar: $("toolbar"), blockFmt: $("blockFmt"),
    postItems: $("postItems"), postCount: $("postCount"),
    pubBtn: $("pubBtn"), newBtn: $("newBtn"), newBtn2: $("newBtn2"),
    aiBtn: $("aiBtn"), syncBtn: $("syncBtn"), syncBadge: $("syncBadge"),
    aiDock: $("aiDock"), aiDockBar: $("aiDockBar"), aiDockFrame: $("aiDockFrame"),
    aiDockFull: $("aiDockFull"), aiDockClose: $("aiDockClose"), aiDockGrip: $("aiDockGrip"),
    modeRich: $("modeRich"), modeMd: $("modeMd"),
    fgColor: $("fgColor"), bgColor: $("bgColor"), fgSwatch: $("fgSwatch"),
    filePicker: $("filePicker"), imagePicker: $("imagePicker"),
    tblPop: $("tblPop"), tblGrid: $("tblGrid"), tblCount: $("tblCount"),
    importBtn: $("importBtn"), mdPicker: $("mdPicker"), proxyBtn: $("proxyBtn"),
    pullBtn: $("pullBtn"), restoreBtn: $("restoreBtn"), restoreCount: $("restoreCount"),
    restorePop: $("restorePop"), restoreList: $("restoreList"), restoreClose: $("restoreClose"),
    draftBar: $("draftBar"), draftBarText: $("draftBarText"),
    draftDisk: $("draftDisk"), draftKeep: $("draftKeep")
  };

  var STORE = "xiray-writer-v2";
  var mode = "rich";
  var currentSlug = "";
  var slugTouched = false;
  var mdTimer = null;

  /* ============================================ Markdown → HTML */

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  /* Markdown 里的内联 HTML（颜色 span、<u>、<mark> 等）不能一律 esc，
     否则「富文本上色 → 切 Markdown → 再切回来」就变成一串 &lt;span&gt; 字母。
     只放行白名单标签，属性也过一遍白名单，防止粘来的东西带脚本。 */
  var INLINE_HTML_TAGS = {
    span: 1, u: 1, b: 1, strong: 1, i: 1, em: 1, s: 1, del: 1, strike: 1,
    mark: 1, sub: 1, sup: 1, small: 1, br: 1, code: 1
  };
  var INLINE_HTML_ATTRS = { href: 1, src: 1, alt: 1, title: 1, class: 1, download: 1 };

  function cleanInlineTag(raw) {
    var m = String(raw).match(/^<\s*(\/?)\s*([a-zA-Z][\w-]*)/);
    if (!m) return "";
    var closing = !!m[1], name = m[2].toLowerCase();
    if (!INLINE_HTML_TAGS[name]) return "";
    if (closing) return "</" + name + ">";
    if (name === "br") return "<br>";

    var attrs = [];
    String(raw).replace(/\s([a-zA-Z-:]+)\s*=\s*("([^"]*)"|'([^']*)')/g, function (_, k, _v, dq, sq) {
      var key = k.toLowerCase();
      var val = dq != null ? dq : sq;
      if (key === "style") {
        var st = keepStyle(val);
        if (st) attrs.push('style="' + st.replace(/"/g, "&quot;") + '"');
      } else if (INLINE_HTML_ATTRS[key]) {
        attrs.push(key + '="' + String(val).replace(/"/g, "&quot;") + '"');
      }
      return "";
    });
    return "<" + name + (attrs.length ? " " + attrs.join(" ") : "") + ">";
  }

  function inline(raw) {
    var s = String(raw), codes = [], tags = [];

    // 1) 行内代码先摘出来：里面的内容既不当 HTML 也不当 Markdown
    s = s.replace(/`([^`]+)`/g, function (m, c) {
      codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000";
    });

    // 2) 白名单内的内联 HTML 也摘成占位符
    s = s.replace(/<\/?\s*[a-zA-Z][\w-]*[^<>]*>/g, function (m) {
      var cleaned = cleanInlineTag(m);
      if (!cleaned) return m;               // 不认识的标签照旧当文字处理
      tags.push(cleaned);
      return "\u0001" + (tags.length - 1) + "\u0001";
    });

    // 3) 剩下的纯文本才转义
    s = esc(s);

    s = s.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/~~([^~]+)~~/g, "<s>$1</s>");
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1">');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\u0000(\d+)\u0000/g, function (m, i) {
      return "<code>" + esc(codes[Number(i)]) + "</code>";
    });
    s = s.replace(/\u0001(\d+)\u0001/g, function (m, i) { return tags[Number(i)]; });
    return s;
  }

  // 只有真正的块级标签才整行当 HTML 原样插入；span / a / u / img 这些是行内的，
  // 必须交给 inline() 处理，否则同一行里的 **粗体**、*斜体* 就没人管了
  var HTML_BLOCK_TAGS = ["div", "figure", "table", "iframe", "video", "audio", "p"];

  function collectHtml(lines, i) {
    var m = lines[i].trim().match(/^<([a-zA-Z][\w-]*)/);
    if (!m) return null;
    var tag = m[1].toLowerCase();
    if (HTML_BLOCK_TAGS.indexOf(tag) < 0) return null;
    if (/\/>\s*$/.test(lines[i])) return { html: lines[i], next: i + 1 };

    var open = new RegExp("<" + tag + "\\b", "gi");
    var close = new RegExp("</" + tag + ">", "gi");
    var depth = 0, buf = [];
    for (var j = i; j < lines.length; j++) {
      buf.push(lines[j]);
      depth += (lines[j].match(open) || []).length;
      depth -= (lines[j].match(close) || []).length;
      if (depth <= 0) return { html: buf.join("\n"), next: j + 1 };
    }
    return { html: buf.join("\n"), next: lines.length };
  }

  function splitRow(line) {
    return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|")
      .map(function (c) { return c.trim(); });
  }

  function mdToHtml(src) {
    var lines = String(healEscapedMd(src || "")).replace(/\r\n/g, "\n").split("\n");
    var out = [], para = [], i = 0;

    function flush() {
      if (!para.length) return;
      // 段落内的换行直接断行（跟 AI 面板的渲染一致）。以前是合并成一个空格，
      // 所以「行尾敲两个空格再回车」也没反应——那是 Markdown 的硬换行写法。
      out.push("<p>" + para.map(function (l) {
        return inline(l.replace(/\s+$/, ""));
      }).join("<br>") + "</p>");
      para = [];
    }

    while (i < lines.length) {
      var line = lines[i];

      if (/^```/.test(line.trim())) {
        flush();
        // ```cpp 里的语言名要留下来：渲染时给代码块上色、右上角显示角标，
        // 转回 Markdown 时也要原样写回去，不然改一次代码块语言就丢了。
        var fence = line.trim().slice(3).trim();
        var langRaw = fence.split(/\s+/)[0] || "";
        // 语言名原样保留（py / cpp / txt / 自选的都行，中文也留着），
        // 只去掉不可能是语言名的字符；真正的解释交给 hl.js 的 aliases
        var lang = window.HL ? HL.cleanLangName(langRaw)
                             : langRaw.replace(/[^\w+#.\u4e00-\u9fa5-]/g, "").toLowerCase();
        var buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i].trim())) { buf.push(lines[i]); i++; }
        i++;
        out.push("<pre" + (lang ? ' data-lang="' + lang + '"' : "") + "><code" +
          (lang ? ' class="language-' + lang + '"' : "") + ">" +
          esc(buf.join("\n")) + "</code></pre>");
        continue;
      }

      if (!line.trim()) { flush(); i++; continue; }

      if (/^\s*</.test(line)) {
        var blk = collectHtml(lines, i);
        if (blk) { flush(); out.push(blk.html); i = blk.next; continue; }
      }

      if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length &&
          /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        flush();
        var head = splitRow(line), rows = [];
        i += 2;
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
          rows.push(splitRow(lines[i])); i++;
        }
        out.push("<table><thead><tr>" +
          head.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") +
          "</tr></thead><tbody>" +
          rows.map(function (r) {
            return "<tr>" + r.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>";
          }).join("") + "</tbody></table>");
        continue;
      }

      var h = line.match(/^(#{1,4})\s+(.*)$/);
      if (h) {
        flush();
        var lvl = Math.min(h[1].length + 1, 4);
        out.push("<h" + lvl + ">" + inline(h[2]) + "</h" + lvl + ">");
        i++; continue;
      }

      if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flush(); out.push("<hr>"); i++; continue; }

      if (/^>\s?/.test(line)) {
        flush();
        var q = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) {
          q.push(lines[i].replace(/^>\s?/, "")); i++;
        }
        out.push("<blockquote><p>" + q.map(inline).join("<br>") + "</p></blockquote>");
        continue;
      }

      if (/^\s*[-*+]\s+/.test(line)) {
        flush();
        var ul = [];
        while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
          ul.push(lines[i].replace(/^\s*[-*+]\s+/, "")); i++;
        }
        out.push("<ul>" + ul.map(function (t) { return "<li>" + inline(t) + "</li>"; }).join("") + "</ul>");
        continue;
      }

      if (/^\s*\d+\.\s+/.test(line)) {
        flush();
        var ol = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          ol.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++;
        }
        out.push("<ol>" + ol.map(function (t) { return "<li>" + inline(t) + "</li>"; }).join("") + "</ol>");
        continue;
      }

      para.push(line);
      i++;
    }
    flush();
    return out.join("\n");
  }

  /* ============================================ HTML → Markdown */

  function keepStyle(style) {
    var keep = [];
    String(style || "").split(";").forEach(function (part) {
      var kv = part.split(":");
      if (kv.length < 2) return;
      var k = kv[0].trim().toLowerCase();
      var v = kv.slice(1).join(":").trim();
      if (!v) return;
      if (k === "color" || k === "background-color" || k === "background") {
        keep.push(k + ": " + v);
      }
    });
    return keep.join("; ");
  }

  /* 发布导出用的版本：除了颜色，还得留住粗体 / 斜体 / 下划线 / 对齐。
     styleWithCSS 模式下 Chrome 用的是 <span style="font-weight: bold"> 而不是 <b>，
     只留颜色的话这些格式一发布就没了。 */
  var FMT_PROPS = [
    "color", "background-color", "background",
    "font-weight", "font-style", "font-variant",
    "text-decoration", "text-decoration-line", "text-decoration-style",
    "text-align"
  ];

  function keepFmtStyle(style) {
    var keep = [];
    String(style || "").split(";").forEach(function (part) {
      var idx = part.indexOf(":");
      if (idx < 0) return;
      var k = part.slice(0, idx).trim().toLowerCase();
      var v = part.slice(idx + 1).trim();
      if (!v) return;
      if (FMT_PROPS.indexOf(k) >= 0) keep.push(k + ": " + v);
    });
    return keep.join("; ");
  }

  /* 代码块取纯文本：<br> 和块级子元素都要还原成换行，
     否则浏览器在 pre 里按回车产生的 <br> 会让多行代码在 Markdown 里被挤成一行 */
  function preText(node) {
    var out = "";
    (function walk(n) {
      Array.prototype.forEach.call(n.childNodes, function (c) {
        if (c.nodeType === 3) { out += c.nodeValue; return; }
        if (c.nodeType !== 1) return;
        if (c.nodeName === "BR") { out += "\n"; return; }
        var isBlock = /^(DIV|P|LI|BLOCKQUOTE)$/.test(c.nodeName);
        if (isBlock && out && out.slice(-1) !== "\n") out += "\n";
        walk(c);
        if (isBlock && out.slice(-1) !== "\n") out += "\n";
      });
    })(node);
    return out.replace(/\u200b/g, "");   // 去掉代码块里的零宽换行锚点
  }

  function nodeToMd(node, inPre) {
    if (node.nodeType === 3) return node.nodeValue.replace(/\u00a0/g, " ");
    if (node.nodeType !== 1) return "";

    var tag = node.nodeName.toLowerCase();
    function inner(n) {
      return Array.prototype.map.call(n.childNodes, function (c) {
        return nodeToMd(c, inPre);
      }).join("");
    }

    switch (tag) {
      case "br": return "\n";
      case "strong": case "b": {
        var t = inner(node); return t.trim() ? "**" + t + "**" : t;
      }
      case "em": case "i": {
        var t2 = inner(node); return t2.trim() ? "*" + t2 + "*" : t2;
      }
      case "s": case "del": case "strike": {
        var t3 = inner(node); return t3.trim() ? "~~" + t3 + "~~" : t3;
      }
      case "u": return "<u>" + inner(node) + "</u>";
      case "code":
        if (inPre) return node.textContent;
        return "`" + node.textContent + "`";
      case "pre": {
        var codeEl = node.querySelector("code");
        var raw = preText(codeEl || node).replace(/^\n+|\n+$/g, "");
        // 语言取自 data-lang（mdToHtml 写的）或 class="language-x"（外面粘进来的）
        var plang = (node.getAttribute("data-lang") || "").trim();
        if (!plang) {
          var pcls = (node.getAttribute("class") || "") + " " +
                     (codeEl ? (codeEl.getAttribute("class") || "") : "");
          var plm = pcls.match(/language-([\w+#.\u4e00-\u9fa5-]+)/i);
          if (plm) plang = plm[1];
        }
        plang = window.HL ? HL.cleanLangName(plang)
                          : plang.replace(/[^\w+#.\u4e00-\u9fa5-]/g, "").toLowerCase();
        return "\n```" + plang + "\n" + raw + "\n```\n\n";
      }
      case "h1": case "h2": case "h3": case "h4": case "h5": case "h6": {
        // 正文从 h2 起算：h2 → "#"，h3 → "##"，以此类推（与 mdToHtml 的 +1 偏移对齐，保证往返稳定）
        var lvl = Math.max(2, Number(tag[1]));
        var hashes = Array(lvl).join("#");
        return "\n" + hashes + " " + inner(node).trim() + "\n\n";
      }
      case "p": return inner(node).trim() + "\n\n";
      case "blockquote": {
        var body = inner(node).trim().replace(/\n{3,}/g, "\n\n");
        return "\n" + body.split("\n").map(function (l) {
          return l.trim() ? "> " + l.trim() : ">";
        }).join("\n") + "\n\n";
      }
      case "ul": case "ol": {
        var ordered = tag === "ol", idx = 1, lines = [];
        Array.prototype.forEach.call(node.children, function (li) {
          if (li.nodeName.toLowerCase() !== "li") return;
          var text = inner(li).trim().replace(/\n+/g, " ");
          lines.push((ordered ? (idx++) + ". " : "- ") + text);
        });
        return "\n" + lines.join("\n") + "\n\n";
      }
      case "li": return inner(node);
      case "a": {
        var cls = node.getAttribute("class") || "";
        if (cls.indexOf("attach") >= 0) return "\n" + node.outerHTML + "\n\n";
        var href = node.getAttribute("href") || "";
        var txt = inner(node).trim() || href;
        return "[" + txt + "](" + href + ")";
      }
      case "img":
        return "![" + (node.getAttribute("alt") || "") + "](" + (node.getAttribute("src") || "") + ")";
      case "hr": return "\n---\n\n";
      case "table": {
        var rows = Array.prototype.slice.call(node.querySelectorAll("tr"));
        if (!rows.length) return "";
        var cells = rows.map(function (tr) {
          return Array.prototype.map.call(tr.children, function (td) {
            return inner(td).trim().replace(/\n+/g, " ").replace(/\|/g, "\\|");
          });
        });
        var width = Math.max.apply(null, cells.map(function (r) { return r.length; }));
        var res = [];
        cells.forEach(function (r, ri) {
          res.push("| " + r.join(" | ") + " |");
          if (ri === 0) res.push("| " + Array(width).fill("---").join(" | ") + " |");
        });
        return "\n" + res.join("\n") + "\n\n";
      }
      case "span": {
        // 图片卡片上的文件名只是编辑器里的装饰，转 Markdown 时丢掉，
        // 让里面的 img 自己变成 ![alt](src)
        if ((node.getAttribute("class") || "").indexOf("ic-name") >= 0) return "";
        var style = node.getAttribute("style") || "";
        var content = inner(node);
        // styleWithCSS 模式下，粗体 / 斜体 / 下划线都是 span 上的样式，
        // 只留颜色的话这些格式一进 Markdown 就没了，得转回 Markdown 语法
        var out = content;
        if (/font-weight\s*:\s*(bold|bolder|[6-9]00)/i.test(style)) out = "**" + out + "**";
        if (/font-style\s*:\s*italic/i.test(style)) out = "*" + out + "*";
        if (/text-decoration[^;]*line-through/i.test(style)) out = "~~" + out + "~~";
        else if (/text-decoration[^;]*underline/i.test(style)) out = "<u>" + out + "</u>";
        var st = keepStyle(style);
        if (st && content.trim()) return '<span style="' + st + '">' + out + "</span>";
        return out;
      }
      case "div": {
        var st2 = keepStyle(node.getAttribute("style"));
        var c2 = inner(node).trim();
        if (st2 && c2) return '<div style="' + st2 + '">' + c2 + "</div>\n\n";
        return c2 + "\n\n";
      }
      case "figure": return "\n" + node.outerHTML + "\n\n";
      case "script": case "style": return "";
      default: return inner(node);
    }
  }

  function htmlToMd(html) {
    var box = document.createElement("div");
    box.innerHTML = html || "";
    return nodeToMd(box, false)
      .replace(/\n{3,}/g, "\n\n")
      .replace(/[ \t]+\n/g, "\n")
      .trim();
  }

  /* ============================================ 净化 */

  var ALLOWED = {
    P: 1, BR: 1, B: 1, STRONG: 1, I: 1, EM: 1, U: 1, S: 1, DEL: 1, STRIKE: 1,
    H1: 1, H2: 1, H3: 1, H4: 1, H5: 1, H6: 1, UL: 1, OL: 1, LI: 1,
    BLOCKQUOTE: 1, PRE: 1, CODE: 1, A: 1, IMG: 1, HR: 1,
    TABLE: 1, THEAD: 1, TBODY: 1, TR: 1, TH: 1, TD: 1,
    SPAN: 1, DIV: 1, FIGURE: 1, FIGCAPTION: 1, SUP: 1, SUB: 1, MARK: 1
  };
  // data-lang 要留着：它是代码块的语言标记，线上靠它上色 + 显示角标
  var KEEP_ATTR = { href: 1, src: 1, alt: 1, "class": 1, download: 1, colspan: 1, rowspan: 1, "data-lang": 1 };

  function sanitize(root, opts) {
    var keepFn = (opts && opts.fmt) ? keepFmtStyle : keepStyle;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT, null);
    var kill = [];
    while (walker.nextNode()) {
      var n = walker.currentNode;
      if (!ALLOWED[n.nodeName.toUpperCase()]) { kill.push(n); continue; }
      Array.prototype.slice.call(n.attributes).forEach(function (attr) {
        var name = attr.name.toLowerCase();
        if (KEEP_ATTR[name]) return;
        if (name === "style") {
          var st = keepFn(attr.value);
          if (st) n.setAttribute("style", st); else n.removeAttribute("style");
          return;
        }
        n.removeAttribute(attr.name);
      });
      if (n.nodeName.toUpperCase() === "A") {
        n.setAttribute("target", "_blank");
        n.setAttribute("rel", "noopener");
      }
    }
    kill.forEach(function (n) {
      while (n.firstChild) n.parentNode.insertBefore(n.firstChild, n);
      if (n.parentNode) n.parentNode.removeChild(n);
    });
    return root;
  }

  /* ---- 自愈：被转义成字母的格式标签还原 --------------------------------
     历史草稿里存过 &lt;span style="color: rgb(255,0,0)"&gt;不确定&lt;/span&gt;
     这种被 esc 过的格式标签，页面上就只能看到一串字母，而且改也改不掉
     （它是纯文本，不是标签）。这里在文本节点里发现白名单格式标签的转义
     残留就顺手还原成真标签。
     代码块里不碰 —— 那里出现 &lt; 本来就是正文。 */
  var FMT_TAG_RE = /<\/?\s*(span|u|b|strong|i|em|s|del|strike|mark|sub|sup|small)\b[^<>]{0,200}>/i;

  function unescMarkup(s) {
    return String(s)
      .replace(/&amp;(lt|gt|quot|#39);/gi, "&$1;")   // 双重转义先降一层
      .replace(/&lt;/g, "<")
      .replace(/&gt;/g, ">")
      .replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'");
  }

  function reviveEscapedFmt(root) {
    if (!root) return root;
    var hit = [], walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    while (walker.nextNode()) {
      var n = walker.currentNode, p = n.parentNode;
      if (p && /^(PRE|CODE|TEXTAREA|SCRIPT|STYLE)$/.test(p.nodeName.toUpperCase())) continue;
      var v = n.nodeValue;
      // 便宜的预筛：既没有 &lt; 也没有 < 的文本不用往下走
      if (!v || (v.indexOf(";") < 0 && v.indexOf("<") < 0)) continue;
      // 转义残留要先还原一层再看，否则 &amp;lt;span 也认不出来
      if (FMT_TAG_RE.test(unescMarkup(v))) hit.push(n);
    }
    hit.forEach(function (t) {
      var html = unescMarkup(t.nodeValue);
      if (!FMT_TAG_RE.test(html)) return;
      var box = document.createElement("div");
      box.innerHTML = html;
      sanitize(box, { fmt: true });          // 还原出来的标签也过一遍白名单
      if (!t.parentNode) return;
      while (box.firstChild) t.parentNode.insertBefore(box.firstChild, t);
      t.parentNode.removeChild(t);
    });
    return root;
  }

  // Markdown 里也藏着同样的转义残留：先看还原后有没有白名单格式标签，有才动
  function healEscapedMd(src) {
    var u = unescMarkup(src);
    return FMT_TAG_RE.test(u) ? u : src;
  }

  /* ---- 深色底 / 浅色字的清洗 ----------------------------------------
     从 VS Code、深色主题网页复制出来的内容普遍是「深色底 + 浅色字」的内联样式。
     粘进来就是一块黑底彩字，而且 execCommand('removeFormat') 只清行内格式，
     清不掉块级元素上的 background-color，所以「去掉格式」也去不干净。
     这里在净化阶段直接把这一对搭配拆掉。 */

  // 返回 { lum: 0~1 相对亮度, alpha } ；认不出来返回 null
  function colorLum(v) {
    var s = String(v || "").trim().toLowerCase();
    if (!s) return null;
    var r, g, b, a = 1;
    var m = s.match(/^rgba?\(([^)]+)\)/);
    if (m) {
      var p = m[1].split(",").map(function (x) { return parseFloat(x); });
      r = p[0]; g = p[1]; b = p[2];
      if (p.length > 3) a = p[3];
    } else if (s.charAt(0) === "#") {
      var h = s.slice(1);
      if (h.length === 3 || h.length === 4) {
        h = h.split("").map(function (c) { return c + c; }).join("");
      }
      if (h.length !== 6 && h.length !== 8) return null;
      r = parseInt(h.slice(0, 2), 16);
      g = parseInt(h.slice(2, 4), 16);
      b = parseInt(h.slice(4, 6), 16);
      if (h.length === 8) a = parseInt(h.slice(6, 8), 16) / 255;
    } else {
      if (s === "black") return { lum: 0, alpha: 1 };
      if (s === "white") return { lum: 1, alpha: 1 };
      return null;
    }
    if (!isFinite(r) || !isFinite(g) || !isFinite(b)) return null;
    return {
      lum: (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255,
      alpha: isFinite(a) ? a : 1
    };
  }

  var DARK_BG_MAX = 0.42;   // 比这更暗的背景 = 深色底，去掉

  function stripDarkPaint(root) {
    var els = Array.prototype.slice.call(root.querySelectorAll("*"));
    if (root.nodeType === 1) els.unshift(root);
    var darkened = [];

    els.forEach(function (n) {
      if (n.nodeName === "IMG") return;             // 图片没有底色
      var c = colorLum(n.style.backgroundColor || n.style.background);
      if (!c || c.alpha < 0.35 || c.lum > DARK_BG_MAX) return;
      n.style.removeProperty("background");
      n.style.removeProperty("background-color");
      darkened.push(n);
    });

    // 深底被拆掉后，原本为它配的字色也得去掉：浅色字落在浅色页面上看不见，
    // 语法高亮那一套配色也不属于这里，一律还原成站点自己的文字色
    darkened.forEach(function (top) {
      [top].concat(Array.prototype.slice.call(top.querySelectorAll("*"))).forEach(function (n) {
        if (n.style && n.style.color) n.style.removeProperty("color");
        if (n.getAttribute && n.getAttribute("color")) n.removeAttribute("color");
      });
    });
    return root;
  }

  /* ---- 识别「粘进来的是代码」---------------------------------------
     VS Code 复制的是「一行一个 div、根元素等宽字体、带深色底」的结构，
     没有 <p>，和普通网页正文很好区分。认出来就直接落成代码块，
     顺便把那堆着色 span 全扔掉——代码块本来就有统一的配色。 */

  var MONO_RE = /(mono|consolas|menlo|monaco|courier|fira|jetbrains|cascadia|source code|ubuntu mono)/i;

  function looksLikeCode(root, text) {
    var pre = root.querySelector("pre");
    if (pre) {
      // 有 pre 不代表整段都是代码：正文里夹一段代码时，pre 只占一小部分，
      // 这种按普通内容插，只有「几乎全是代码」才转成代码块
      var preLen = preText(pre).replace(/\s/g, "").length;
      var allLen = String(text || "").replace(/\s/g, "").length;
      return allLen === 0 || preLen / allLen > 0.7;
    }
    var lines = String(text || "").split("\n").filter(function (l) { return l.trim(); });
    if (lines.length < 2) return false;
    if (root.querySelector("p")) return false;   // 有段落结构的是正文，不是代码
    var els = [root].concat(Array.prototype.slice.call(root.querySelectorAll("*")));
    var mono = els.some(function (n) {
      return n.style && MONO_RE.test(n.style.fontFamily || "");
    });
    if (!mono) return false;
    // 还得是「深色底」或「white-space: pre」——IDE / 终端复制出来的特征，
    // 免得把某些用 div 排版、带等宽行内码的网页正文整段当代码吞掉
    var dark = els.some(function (n) {
      var c = colorLum(n.style.backgroundColor || n.style.background);
      return c && c.alpha >= 0.35 && c.lum <= DARK_BG_MAX;
    });
    return dark || /white-space:\s*pre/i.test(root.innerHTML);
  }

  // 代码块内容：纯文本，保留换行，去掉行尾空白和首尾空行
  function codeTextOf(box) {
    return preText(box)
      .replace(/\u00a0/g, " ")
      .replace(/[ \t]+$/gm, "")
      .replace(/^\n+|\n+$/g, "");
  }

  /* ============================================ 代码高亮
     写作台里代码块有两态：
       · 光标在块里（.editing）：纯文本，随便改，绝不往 DOM 里塞 span；
       · 光标离开：就地染色，只是显示层。
     这样编辑时不会出现「颜色跟着光标乱跳」「输入把 span 拆断」，
     平时看到的又都是彩色代码。染色产生的 span 发布前会被 stripHl() 剥掉。 */

  function preOf(node) {
    while (node && node !== el.rich) {
      if (node.nodeType === 1 && node.nodeName === "PRE") return node;
      node = node.parentNode;
    }
    return null;
  }

  var activePre = null;

  function paintPre(pre) {
    if (!pre || !window.HL) return;
    if (pre.classList.contains("editing")) return;
    var code = pre.querySelector("code") || pre;
    var raw = code.textContent;
    if (!raw) return;
    HL.paint(code, raw, HL.langOf(pre, code));
    pre.classList.add("hl-on");
  }

  function unpaintPre(pre) {
    if (!pre || !pre.classList.contains("hl-on")) return;
    var code = pre.querySelector("code") || pre;
    var raw = code.textContent;
    code.textContent = raw;          // 丢掉 span，只留文字
    pre.classList.remove("hl-on");
  }

  function paintAll(root) {
    var box = root || el.rich;
    if (!box || !box.querySelectorAll) return;
    Array.prototype.forEach.call(box.querySelectorAll("pre"), paintPre);
    if (!root) autoLangRich();
  }

  function unpaintAll(root) {
    var box = root || el.rich;
    if (!box || !box.querySelectorAll) return;
    Array.prototype.forEach.call(box.querySelectorAll("pre"), unpaintPre);
  }

  function setActivePre(pre) {
    if (pre === activePre) return;
    var old = activePre;
    activePre = pre;
    if (old) { old.classList.remove("editing"); paintPre(old); }
    if (pre) { pre.classList.add("editing"); unpaintPre(pre); }
  }

  /* 光标一动就知道在不在代码块里：进出只切换那一个块，不重排整篇 */
  document.addEventListener("selectionchange", function () {
    var sel = window.getSelection();
    var node = sel && sel.anchorNode;
    if (!node || !el.rich.contains(node)) { setActivePre(null); return; }
    setActivePre(preOf(node));
  });

  el.rich.addEventListener("blur", function () { setActivePre(null); });

  /* 发布 / 存草稿用的 HTML：把显示层的染色 span 剥干净 */
  function stripHl(html) {
    if (!html || html.indexOf("t-") < 0) return html;
    var box = document.createElement("div");
    box.innerHTML = html;
    Array.prototype.forEach.call(box.querySelectorAll("pre"), function (pre) {
      if (!pre.classList.contains("hl-on") && !pre.querySelector('[class^="t-"]')) return;
      var code = pre.querySelector("code") || pre;
      code.textContent = code.textContent;
      pre.classList.remove("hl-on", "editing");
    });
    return box.innerHTML;
  }

  /* ============================================ 模式切换 */

  function setMode(next) {
    if (next === mode) return;

    if (next === "md") {
      setActivePre(null);
      unpaintAll();                       // 转 md 前先把染色层剥掉，别写进草稿
      el.md.value = htmlToMd(el.rich.innerHTML);
      renderMdPreview();
    } else {
      setActivePre(null);
      el.rich.innerHTML = mdToHtml(el.md.value) || "";
      ensureChips();
      paintAll();
    }

    mode = next;
    el.modeRich.classList.toggle("active", mode === "rich");
    el.modeMd.classList.toggle("active", mode === "md");
    el.richWrap.style.display = mode === "rich" ? "block" : "none";
    el.mdWrap.classList.toggle("show", mode === "md");
    updateToolbarState();
    saveDraft();
    setStatus(mode === "rich" ? "富文本模式" : "Markdown 模式");
  }

  function renderMdPreview() {
    el.mdPreview.innerHTML = mdToHtml(el.md.value);
    if (window.HL) HL.run(el.mdPreview);
    autoLangMd();
  }

  /* 没写 ```语言 的代码块，交给服务端的模型认一次；认出来就补 data-lang，
     角标和配色立刻跟上，转回 Markdown / 发布时也带着这个语言。 */
  function autoLangMd() {
    if (!window.AILang) return;
    AILang.debounced(el.mdPreview, {
      key: "md",
      onApplied: function (pres) {
        for (var i = 0; i < pres.length; i++) {
          var pre = pres[i];
          if (pre.getAttribute("data-lang") && !pre.getAttribute("data-hl")) {
            var code = pre.querySelector("code") || pre;
            if (window.HL) { HL.paint(code, code.textContent, HL.langOf(pre, code)); pre.setAttribute("data-hl", "1"); }
          }
        }
      }
    }, 1200);
  }

  function autoLangRich() {
    if (!window.AILang) return;
    AILang.debounced(el.rich, { key: "rich", onApplied: function () { paintAll(); } }, 1500);
  }

  /* ============================================ 工具栏 */

  /* 选区记忆：下拉框、取色器必须让浏览器执行默认行为才能弹出，
     但那样编辑区会失焦，所以点它们之前先把选区存下来，执行命令前再恢复。 */
  var savedRange = null;

  function saveSelection() {
    if (mode !== "rich") return;
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    var r = sel.getRangeAt(0);
    if (el.rich.contains(r.commonAncestorContainer)) savedRange = r.cloneRange();
  }

  function restoreSelection() {
    if (!savedRange) return false;
    try {
      el.rich.focus();
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedRange);
      return true;
    } catch (e) {
      savedRange = null;
      return false;
    }
  }

  function exec(cmd, value) {
    if (cmd === "removeFormat") return clearFormat();
    restoreSelection();
    el.rich.focus();
    try { document.execCommand("styleWithCSS", false, true); } catch (e) {}
    document.execCommand(cmd, false, value || null);
    saveSelection();
    updateToolbarState();
  }

  function insertHtml(html) {
    restoreSelection();
    el.rich.focus();
    document.execCommand("insertHTML", false, html);
    saveSelection();
  }

  /* 代码块插完必须在后面补一个空段落，否则光标困在 pre 里出不去，
     想在代码块下面接着写正文就没地方落笔。 */

  // 光标所在的最内层块（P / H* / LI / DIV / PRE / BLOCKQUOTE），没有就返回 el.rich
  function blockHostAtCaret() {
    var s = window.getSelection();
    if (!s || !s.rangeCount) return el.rich;
    var e = s.anchorNode && (s.anchorNode.nodeType === 1 ? s.anchorNode : s.anchorNode.parentElement);
    while (e && e !== el.rich) {
      if (/^(P|H1|H2|H3|H4|H5|H6|LI|DIV|BLOCKQUOTE|PRE)$/.test(e.nodeName)) return e;
      e = e.parentElement;
    }
    return el.rich;
  }

  /* 块级元素（代码块、表格）不能用 insertHTML 插：光标在段落里的时候，
     Chrome 认为 <pre>/<table> 嵌在 <p> 里非法，会把它拆成一堆行内 span。
     所以直接建 DOM 节点，插在当前段落下面。 */
  function insertBlockNode(node) {
    var host = blockHostAtCaret();
    if (!host || host === el.rich) {
      el.rich.appendChild(node);
    } else if (host.nodeName === "P" && isEmptyBlock(host)) {
      // 光标停在一个空行上：直接占掉这一行，块就出现在他想要的位置
      host.parentNode.replaceChild(node, host);
    } else {
      // 引用 / 列表 / 表格里不放块，挂到它们外面
      var outer = host;
      while (outer.parentElement && outer.parentElement !== el.rich &&
             /^(BLOCKQUOTE|LI|UL|OL|TD|TH)$/.test(outer.parentElement.nodeName)) {
        outer = outer.parentElement;
      }
      outer.parentNode.insertBefore(node, outer.nextSibling);
    }
    return node;
  }

  function insertCodeBlock(text) {
    var pre = document.createElement("pre");
    var code = document.createElement("code");
    code.textContent = text == null ? "" : String(text);
    pre.appendChild(code);
    insertBlockNode(pre);
    ensureTailPara(pre);
    return pre;
  }

  // 某块之后没有能落笔的段落时补一个（代码块 / 引用 / 表格后面最容易卡住）
  function ensureTailPara(block) {
    var next = block.nextElementSibling;
    if (next && next.nodeName !== "BR") return next;
    var p = document.createElement("p");
    p.innerHTML = "<br>";
    block.parentNode.insertBefore(p, next || null);
    return p;
  }

  function updateToolbarState() {
    if (mode !== "rich") return;
    ["bold", "italic", "underline", "strikeThrough",
     "insertUnorderedList", "insertOrderedList"].forEach(function (cmd) {
      var btn = el.toolbar.querySelector('[data-cmd="' + cmd + '"]');
      if (!btn) return;
      var on = false;
      try { on = document.queryCommandState(cmd); } catch (e) {}
      btn.classList.toggle("on", on);
    });
    syncBlockFmt();
  }

  /* 下拉框跟随光标所在段落的实际格式，而不是点完就跳回「正文」 */
  function syncBlockFmt() {
    if (mode !== "rich") return;
    var v = "";
    try {
      v = String(document.queryCommandValue("formatBlock") || "");
    } catch (e) {}
    v = v.toLowerCase().replace(/[<>]/g, "").trim();
    var map = {
      h1: "h2", h2: "h2", h3: "h3", h4: "h4", h5: "h4", h6: "h4",
      blockquote: "blockquote", pre: "pre"
    };
    el.blockFmt.value = map[v] || "p";
  }

  el.toolbar.addEventListener("mousedown", function (e) {
    // 下拉框和取色器靠浏览器默认的 mousedown 行为弹出，不能 preventDefault，
    // 否则点了没反应。改为先记住选区，执行命令前再恢复。
    if (e.target.closest("select") || e.target.closest(".color-btn")) {
      saveSelection();
      return;
    }
    if (e.target.closest(".tb")) {
      e.preventDefault();
      return;
    }
  });

  el.toolbar.addEventListener("click", function (e) {
    var btn = e.target.closest(".tb");
    if (!btn) return;

    if (mode === "md") { mdToolbar(btn); return; }

    var cmd = btn.getAttribute("data-cmd");
    var act = btn.getAttribute("data-act");

    if (cmd) { exec(cmd); return; }

    if (act === "link") {
      var sel = String(window.getSelection() || "");
      var url = prompt("链接地址", "https://");
      if (!url) return;
      if (sel) exec("createLink", url);
      else insertHtml('<a href="' + url + '" target="_blank" rel="noopener">' + esc(url) + "</a>");
      return;
    }
    if (act === "table") { openTblPicker(btn); return; }
    if (act === "hr") { insertHtml("<hr><p><br></p>"); return; }
    if (act === "code") {
      var s = String(window.getSelection() || "");
      insertHtml("<code>" + esc(s || "代码") + "</code>");
      return;
    }
    if (act === "attach") { el.filePicker.click(); return; }
    if (act === "image") { el.imagePicker.click(); return; }
  });

  el.blockFmt.addEventListener("change", function () {
    var v = el.blockFmt.value;
    if (mode === "md") {
      var prefix = { p: "", h2: "## ", h3: "### ", h4: "#### ", blockquote: "> ", pre: "```\n\n```" }[v] || "";
      var st = el.md.selectionStart;
      insertAtCursor(el.md, prefix);
      // 代码块插完把光标放进两行 ``` 中间，直接就能写
      if (v === "pre") el.md.selectionStart = el.md.selectionEnd = st + 4;
      renderMdPreview();
      el.blockFmt.value = "p";
      return;
    }
    if (v === "pre") {
      var made = insertCodeBlock("代码");
      // 插入后把光标圈到「代码」上，直接输入就替换掉
      try {
        var code = made && made.querySelector("code");
        if (code) {
          var r = document.createRange();
          r.selectNodeContents(code);
          var s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
          saveSelection();
        }
      } catch (e) {}
    } else {
      exec("formatBlock", v);
    }
    updateToolbarState();
  });

  el.fgColor.addEventListener("input", function () {
    el.fgSwatch.style.background = el.fgColor.value;
    if (mode === "rich") exec("foreColor", el.fgColor.value);
  });
  el.bgColor.addEventListener("input", function () {
    if (mode === "rich") exec("hiliteColor", el.bgColor.value);
  });

  /* ---- Markdown 模式工具栏 ---- */

  function insertAtCursor(ta, text) {
    var s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
    ta.value = v.slice(0, s) + text + v.slice(e);
    ta.selectionStart = ta.selectionEnd = s + text.length;
    ta.focus();
  }

  function wrapSelection(ta, before, after) {
    var s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
    var sel = v.slice(s, e) || "文字";
    ta.value = v.slice(0, s) + before + sel + after + v.slice(e);
    ta.selectionStart = s + before.length;
    ta.selectionEnd = s + before.length + sel.length;
    ta.focus();
  }

  function mdToolbar(btn) {
    var cmd = btn.getAttribute("data-cmd");
    var act = btn.getAttribute("data-act");

    if (cmd === "bold") return wrapSelection(el.md, "**", "**");
    if (cmd === "italic") return wrapSelection(el.md, "*", "*");
    if (cmd === "underline") return wrapSelection(el.md, "<u>", "</u>");
    if (cmd === "strikeThrough") return wrapSelection(el.md, "~~", "~~");
    if (cmd === "insertUnorderedList") return insertAtCursor(el.md, "\n- ");
    if (cmd === "insertOrderedList") return insertAtCursor(el.md, "\n1. ");
    if (cmd === "removeFormat") return;

    if (act === "link") {
      var url = prompt("链接地址", "https://");
      if (!url) return;
      return wrapSelection(el.md, "[", "](" + url + ")");
    }
    if (act === "code") {
      if (el.md.selectionEnd > el.md.selectionStart) return wrapSelection(el.md, "`", "`");
      return insertAtCursor(el.md, "`代码`");
    }
    if (act === "table") { openTblPicker(btn); return; }
    if (act === "hr") return insertAtCursor(el.md, "\n\n---\n\n");
    if (act === "attach") return el.filePicker.click();
    if (act === "image") return el.imagePicker.click();
  }

  /* ============================================ 表格（自定义行列） */

  var TBL_MAX = 8;
  var tblPick = { c: 3, r: 3 };

  function buildTblGrid() {
    if (el.tblGrid.childNodes.length) return;
    for (var r = 1; r <= TBL_MAX; r++) {
      for (var c = 1; c <= TBL_MAX; c++) {
        var d = document.createElement("button");
        d.type = "button";
        d.className = "tbl-cell";
        d.setAttribute("data-r", r);
        d.setAttribute("data-c", c);
        d.title = c + " 列 × " + r + " 行";
        el.tblGrid.appendChild(d);
      }
    }
  }

  function paintTblPick(c, r) {
    tblPick = { c: c, r: r };
    var cells = el.tblGrid.children;
    for (var i = 0; i < cells.length; i++) {
      var cr = Number(cells[i].getAttribute("data-r"));
      var cc = Number(cells[i].getAttribute("data-c"));
      cells[i].classList.toggle("on", cr <= r && cc <= c);
    }
    el.tblCount.textContent = c + " 列 × " + r + " 行";
  }

  function openTblPicker(btn) {
    buildTblGrid();
    paintTblPick(tblPick.c, tblPick.r);
    el.tblPop.hidden = false;
    var b = btn.getBoundingClientRect();
    var w = el.tblPop.offsetWidth, h = el.tblPop.offsetHeight;
    var left = Math.max(8, Math.min(b.left, window.innerWidth - w - 8));
    var top = b.bottom + 6;
    if (top + h > window.innerHeight - 8) top = Math.max(8, b.top - h - 6);
    el.tblPop.style.left = left + "px";
    el.tblPop.style.top = top + "px";
  }

  function closeTblPicker() {
    el.tblPop.hidden = true;
  }

  function insertTable(cols, rows) {
    var table = document.createElement("table");
    var thead = document.createElement("thead");
    var trh = document.createElement("tr");
    for (var c = 0; c < cols; c++) {
      var th = document.createElement("th");
      th.textContent = "列 " + (c + 1);
      trh.appendChild(th);
    }
    thead.appendChild(trh);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    for (var r = 0; r < rows; r++) {
      var tr = document.createElement("tr");
      for (var c2 = 0; c2 < cols; c2++) {
        var td = document.createElement("td");
        td.innerHTML = "<br>";
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);

    insertBlockNode(table);
    ensureTailPara(table);
    var first = table.querySelector("tbody td") || table.querySelector("th");
    if (first) placeCaret(first, false);
    return table;
  }

  function mdTable(cols, rows) {
    var head = [], sep = [], empty = [];
    for (var c = 0; c < cols; c++) {
      head.push("列 " + (c + 1));
      sep.push("---");
      empty.push(" ");
    }
    var lines = ["| " + head.join(" | ") + " |", "| " + sep.join(" | ") + " |"];
    for (var r = 0; r < rows; r++) lines.push("| " + empty.join(" | ") + " |");
    return "\n" + lines.join("\n") + "\n";
  }

  el.tblGrid.addEventListener("mouseover", function (e) {
    var t = e.target.closest ? e.target.closest(".tbl-cell") : null;
    if (!t) return;
    paintTblPick(Number(t.getAttribute("data-c")), Number(t.getAttribute("data-r")));
  });

  el.tblGrid.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest(".tbl-cell") : null;
    if (!t) return;
    var c = Number(t.getAttribute("data-c")), r = Number(t.getAttribute("data-r"));
    closeTblPicker();
    if (mode === "md") {
      insertAtCursor(el.md, mdTable(c, r));
      renderMdPreview();
    } else {
      restoreSelection();
      el.rich.focus();
      insertTable(c, r);
      saveSelection();
      updateToolbarState();
    }
  });

  document.addEventListener("click", function (e) {
    if (el.tblPop.hidden) return;
    if (el.tblPop.contains(e.target)) return;
    if (e.target.closest && e.target.closest('[data-act="table"]')) return;
    closeTblPicker();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && el.tblPop && !el.tblPop.hidden) closeTblPicker();
  });

  /* ============================================ 附件 / 图片 */

  function fmtSize(n) {
    n = Number(n) || 0;
    if (n < 1024) return n + " B";
    if (n < 1048576) return Math.round(n / 1024) + " KB";
    return (n / 1048576).toFixed(1) + " MB";
  }

  /* ---- 图片卡片 -------------------------------------------------
     插入时先完整显示 2 秒（IMG_HOLD_MS），然后收成一张「xxx.png」小卡片，
     底纹用图片本身，点一下能来回展开/收起。
     卡片只是编辑器里的显示方式：Markdown 预览和线上文章看到的都是原图。 */

  var IMG_HOLD_MS = 2000;

  function imgName(src, alt) {
    if (alt && /\.(png|jpe?g|gif|webp|svg)$/i.test(alt)) return alt;
    var s = String(src || "").split("?")[0].split("/").pop();
    try { s = decodeURIComponent(s); } catch (e) {}
    return s || "图片";
  }

  function chipOf(img, collapsed) {
    var chip = document.createElement("span");
    chip.className = "img-chip" + (collapsed ? " collapsed" : "");
    chip.title = "点一下展开 / 收起";
    var name = document.createElement("span");
    name.className = "ic-name";
    name.textContent = imgName(img.getAttribute("src"), img.getAttribute("alt"));
    if (!img.getAttribute("alt")) img.setAttribute("alt", name.textContent);
    img.parentNode.insertBefore(chip, img);
    chip.appendChild(img);
    chip.appendChild(name);
    return chip;
  }

  // 给卡片补上文件名标签。insertHTML 会把 display:none 里的文字丢掉，
  // 所以插入后统一用 JS 再填一次，别指望 HTML 字符串里带过去。
  function labelOf(chip) {
    var img = chip.querySelector("img");
    if (!img) return null;
    var name = imgName(img.getAttribute("src"), img.getAttribute("alt"));
    var lab = chip.querySelector(".ic-name");
    if (!lab) {
      lab = document.createElement("span");
      lab.className = "ic-name";
      chip.appendChild(lab);
    }
    if (!lab.textContent) lab.textContent = name;
    if (!img.getAttribute("alt")) img.setAttribute("alt", name);
    if (!chip.title) chip.title = "点一下展开 / 收起";
    return lab;
  }

  // 编辑器里裸着的 img 全部包成卡片（打开旧文章、Markdown 切回来、粘贴时用）
  function ensureChips() {
    if (!el.rich) return;
    var chips = el.rich.querySelectorAll(".img-chip");
    for (var j = 0; j < chips.length; j++) labelOf(chips[j]);

    var imgs = el.rich.querySelectorAll("img");
    for (var i = 0; i < imgs.length; i++) {
      var img = imgs[i];
      var p = img.parentNode;
      if (p && p.classList && p.classList.contains("img-chip")) continue;
      chipOf(img, true);
    }
    ensureEditableTail();
  }

  // 最后一个块是代码块 / 引用 / 表格 / 列表 / 分割线时，末尾补一个空段落，
  // 否则打开旧文章或者从 Markdown 切回来，光标没法落到下面继续写。
  function ensureEditableTail() {
    if (!el.rich) return;
    var last = el.rich.lastElementChild;
    if (!last) return;
    if (/^(PRE|BLOCKQUOTE|TABLE|UL|OL|HR)$/.test(last.nodeName)) ensureTailPara(last);
  }

  function collapseAfterHold(chip) {
    setTimeout(function () {
      if (!chip || !chip.isConnected) return;
      collapseChip(chip);
    }, IMG_HOLD_MS);
  }

  // 收起卡片；如果光标正好在卡片里面，挪到卡片后面——否则字打在看不见的地方
  function collapseChip(chip) {
    var sel = window.getSelection();
    var inside = sel && sel.rangeCount && chip.contains(sel.anchorNode);
    chip.classList.add("collapsed");
    if (!inside) return;
    try {
      var r = document.createRange();
      r.setStartAfter(chip);
      r.collapse(true);
      sel.removeAllRanges();
      sel.addRange(r);
    } catch (e) {}
  }

  function uploadFile(file, asImage) {
    if (!file) return;
    if (file.size > 25 * 1024 * 1024) { setStatus("文件超过 25MB", "err"); return; }
    setStatus("正在上传 " + file.name + " …");

    var reader = new FileReader();
    reader.onload = function () {
      var b64 = String(reader.result).split(",")[1];
      fetch("/api/upload", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ filename: file.name, data: b64 })
      }).then(function (r) { return r.json(); })
        .then(function (res) {
          if (!res.ok) { setStatus("上传失败：" + (res.error || ""), "err"); return; }
          var f = res.file;
          var isImg = asImage || /\.(png|jpe?g|gif|webp|svg)$/i.test(f.name);

          if (isImg) {
            if (mode === "md") {
              // Markdown 里就是普通图片语法，右侧预览直接看到原图
              insertAtCursor(el.md, "\n![" + f.display + "](" + f.url + ")\n");
              renderMdPreview();
            } else {
              insertHtml('<p><span class="img-chip"><img src="' + f.url +
                '" alt="' + esc(f.display) + '"><span class="ic-name">' +
                esc(f.display) + "</span></span></p>");
              ensureChips();   // 补回被 insertHTML 丢掉的文件名
              var chips = el.rich.querySelectorAll(".img-chip:not(.collapsed)");
              if (chips.length) collapseAfterHold(chips[chips.length - 1]);
            }
          } else {
            var aHtml = '<p><a class="attach" href="' + f.url + '" download="' +
              f.display + '">📎 ' + f.display +
              '<span class="size">' + f.size + "</span></a></p>";
            if (mode === "md") {
              insertAtCursor(el.md, "\n" + aHtml + "\n");
              renderMdPreview();
            } else {
              insertHtml(aHtml);
            }
          }
          if (f.compressed) {
            setStatus("已插入 " + f.display + " · 压缩 " + fmtSize(f.orig_bytes) +
              " → " + f.size + " · " + (f.note || ""), "ok");
          } else {
            setStatus("已插入 " + f.display + "（" + f.size + "）", "ok");
          }
        })
        .catch(function () { setStatus("上传出错", "err"); });
    };
    reader.readAsDataURL(file);
  }

  el.filePicker.addEventListener("change", function () {
    uploadFile(this.files[0], false); this.value = "";
  });
  el.imagePicker.addEventListener("change", function () {
    uploadFile(this.files[0], true); this.value = "";
  });

  /* 「清除格式」得自己动手：execCommand('removeFormat') 只处理行内格式，
     块级元素（div/p/pre）上的 color / background-color 它一概不动，
     从别处粘来的黑底就卡在这上面，所以再扫一遍选区把内联样式硬清掉。 */
  function clearFormat() {
    restoreSelection();
    el.rich.focus();
    try { document.execCommand("removeFormat"); } catch (e) {}

    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;

    function clean(n) {
      if (!n || n.nodeType !== 1 || n === el.rich) return;
      if (n.classList && n.classList.contains("img-chip")) return;  // 图片卡片的显示状态别动
      n.removeAttribute("style");
      ["color", "bgcolor", "face", "align"].forEach(function (a) { n.removeAttribute(a); });
    }

    var r = sel.getRangeAt(0).cloneRange();
    if (r.collapsed) {
      var anchor = sel.anchorNode;
      var blk = leafBlockOf(anchor, el.rich) ||
        (anchor && (anchor.nodeType === 1 ? anchor : anchor.parentElement));
      if (!blk || blk === el.rich) { setStatus("先把要清格式的文字选上"); return; }
      clean(blk);
      Array.prototype.forEach.call(blk.querySelectorAll("*"), clean);
    } else {
      Array.prototype.forEach.call(el.rich.querySelectorAll("*"), function (n) {
        if (r.intersectsNode(n)) clean(n);
      });
    }

    saveSelection();
    updateToolbarState();
    setStatus("已清除格式", "ok");
  }

  /* ============================================ 粘贴净化 */

  // 已经在代码块里粘贴：只要纯文本，换行原样保留，不再套一层代码块
  function pasteIntoPre(pre, text) {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    var r = sel.getRangeAt(0);
    r.deleteContents();
    var txt = String(text).replace(/\r\n?/g, "\n");
    // 光标停在一行中间时先补个换行，免得新代码跟上一行粘在一起
    var before = "";
    try {
      var probe = document.createRange();
      probe.selectNodeContents(pre);
      probe.setEnd(r.startContainer, r.startOffset);
      before = probe.toString().replace(/\u200b/g, "");
    } catch (e) {}
    if (before && !/\n$/.test(before) && txt && !/^\n/.test(txt)) txt = "\n" + txt;
    var tn = document.createTextNode(txt);
    r.insertNode(tn);
    var after = document.createRange();
    after.setStartAfter(tn);
    after.collapse(true);
    sel.removeAllRanges();
    sel.addRange(after);
    saveSelection();
  }

  el.rich.addEventListener("paste", function (e) {
    var cd = e.clipboardData || window.clipboardData;
    if (!cd) return;
    var html = cd.getData("text/html");
    var plain = cd.getData("text/plain") || "";
    var sel = window.getSelection();
    var host = sel && sel.rangeCount ? blockOf(sel.anchorNode) : null;

    if (host && host.nodeName === "PRE") {
      e.preventDefault();
      pasteIntoPre(host, plain);
      return;
    }

    if (!html) return;   // 纯文本：交给浏览器默认插入

    e.preventDefault();
    var box = document.createElement("div");
    box.innerHTML = html;
    // 判定要用净化前的副本：sanitize 只保留颜色，会把 font-family 裁掉，
    // 那样就认不出「这是 IDE 里复制来的代码」了
    var probe = box.cloneNode(true);
    sanitize(box);

    // 整段是代码就直接转成代码块：VS Code 的黑底彩字进不来，缩进也保住
    var raw = codeTextOf(probe);
    if (looksLikeCode(probe, raw)) {
      var pre = insertCodeBlock(raw);
      if (pre) {
        if (raw) placeCaret(pre, true);
        saveSelection();
      }
      ensureChips();
      return;
    }

    stripDarkPaint(box);
    document.execCommand("insertHTML", false, box.innerHTML);
    ensureChips();
  });

  el.rich.addEventListener("keyup", updateToolbarState);
  el.rich.addEventListener("mouseup", updateToolbarState);

  // 点一下图片卡片：展开 / 收起（只在编辑器里，线上文章始终是原图）
  el.rich.addEventListener("click", function (e) {
    var t = e.target;
    var chip = t && t.closest ? t.closest(".img-chip") : null;
    if (!chip) return;
    if (chip.classList.contains("collapsed")) chip.classList.remove("collapsed");
    else collapseChip(chip);
  });

  /* ============================================ 引用 / 代码块的删除修复
     Chrome 的原生行为：块内文字删光后，空的 blockquote / pre 会一直留在文档里；
     在块首按退格还会把块并进上一段，并塞进一堆内联样式。两种都很坑，这里接管。 */

  function blockOf(node) {
    var n = node && (node.nodeType === 1 ? node : node.parentElement);
    while (n && n !== el.rich) {
      if (n.nodeName === "BLOCKQUOTE" || n.nodeName === "PRE") return n;
      n = n.parentElement;
    }
    return null;
  }

  function isEmptyBlock(b) {
    // \u200b 是代码块的换行锚点，不能算内容，否则空的代码块永远删不掉
    if (b.textContent.replace(/[\s\u00a0\u200b]/g, "")) return false;
    return !b.querySelector("img, table, hr, video, audio, iframe, a[class]");
  }

  function placeCaret(node, atEnd) {
    try {
      var r = document.createRange();
      r.selectNodeContents(node);
      r.collapse(!atEnd);
      var s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
      saveSelection();
    } catch (e) {}
  }

  // 空块 → 换成普通空段落；有内容就移到上一段末尾
  function dropBlock(b) {
    var prev = b.previousElementSibling;
    var p = document.createElement("p");
    p.innerHTML = "<br>";
    b.parentNode.replaceChild(p, b);
    if (prev && prev.nodeName !== "BR") placeCaret(prev, true);
    else placeCaret(p, false);
    return p;
  }

  // 块 → 普通段落，保留文字但清掉浏览器塞进来的内联样式。
  // 块里本来就有多个段落时要逐个拆开，不能整段塞进一个 <p>（会变成非法嵌套）。
  function unwrapBlock(b) {
    var made = [];
    var frag = document.createDocumentFragment();

    function makeP(html) {
      var p = document.createElement("p");
      p.innerHTML = html || "<br>";
      made.push(p);
      return p;
    }

    if (b.nodeName === "PRE") {
      var p = document.createElement("p");
      preText(b).split("\n").forEach(function (line, i) {
        if (i) p.appendChild(document.createElement("br"));
        p.appendChild(document.createTextNode(line));
      });
      if (!p.firstChild) p.innerHTML = "<br>";
      made.push(p);
      frag.appendChild(p);
    } else {
      var blockKids = Array.prototype.filter.call(b.children, function (c) {
        return /^(P|H1|H2|H3|H4|H5|H6|DIV|BLOCKQUOTE|UL|OL|PRE)$/.test(c.nodeName);
      });
      if (blockKids.length) {
        Array.prototype.forEach.call(blockKids, function (c) {
          if (/^(P|DIV)$/.test(c.nodeName)) frag.appendChild(makeP(c.innerHTML));
          else frag.appendChild(c.cloneNode(true));
        });
      } else {
        frag.appendChild(makeP(b.innerHTML));
      }
    }

    Array.prototype.slice.call(frag.querySelectorAll("[style]")).forEach(function (n) {
      n.removeAttribute("style");
    });
    b.parentNode.replaceChild(frag, b);
    if (made.length) placeCaret(made[0], false);
    return made[0] || null;
  }

  function caretAtStart(b) {
    var s = window.getSelection();
    if (!s || !s.rangeCount) return false;
    var r = s.getRangeAt(0).cloneRange();
    r.selectNodeContents(b);
    r.setEnd(s.getRangeAt(0).startContainer, s.getRangeAt(0).startOffset);
    return r.toString().replace(/[\s\u00a0\u200b]/g, "") === "";
  }

  function caretAtEnd(b) {
    var s = window.getSelection();
    if (!s || !s.rangeCount) return false;
    var r = s.getRangeAt(0).cloneRange();
    r.selectNodeContents(b);
    r.setStart(s.getRangeAt(0).endContainer, s.getRangeAt(0).endOffset);
    return r.toString().replace(/[\s\u00a0\u200b]/g, "") === "";
  }

  // 光标在代码块最后一行，而且那行是空的
  function atEmptyLastLine(pre) {
    if (!caretAtEnd(pre)) return false;
    return /\n$/.test(preText(pre));
  }

  // 跳出代码块：收掉末尾的空行，光标落到后面的段落里
  function leavePre(pre) {
    var txt = preText(pre).replace(/\n+$/, "");
    var code = document.createElement("code");
    code.textContent = txt;
    pre.innerHTML = "";
    pre.classList.remove("hl-on", "editing");   // 染色层随 innerHTML 一起没了，类也清掉
    pre.appendChild(code);
    var p = ensureTailPara(pre);
    placeCaret(p, false);
  }

  // 光标所在的最内层段落（blockquote > p 里的 p）
  function leafBlockOf(node, root) {
    var n = node && (node.nodeType === 1 ? node : node.parentElement);
    while (n && n !== root) {
      if (/^(P|H1|H2|H3|H4|H5|H6|LI|DIV)$/.test(n.nodeName)) return n;
      n = n.parentElement;
    }
    return null;
  }

  el.rich.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var b = null, sel = window.getSelection();
    if (sel && sel.rangeCount) b = blockOf(sel.anchorNode);
    if (!b) return;

    // 代码块里按回车：插入 <br> 当换行锚点，后面再跟一个零宽字符。
    // 不加零宽字符的话，Chrome 会把光标吸附到上一行文本末尾，接着敲的字会跑到上一行去。
    // 零宽字符只在编辑区里存在，转 Markdown 时由 preText() 剥掉。
    if (e.key === "Enter" && b.nodeName === "PRE") {
      e.preventDefault();
      // 最后一行已经是空行再按回车 = 跳出代码块，到下面写正文去
      if (atEmptyLastLine(b)) {
        leavePre(b);
        updateToolbarState();
        return;
      }
      var r0 = sel.getRangeAt(0);
      r0.deleteContents();
      var br = document.createElement("br");
      r0.insertNode(br);
      var anchor = document.createTextNode("\u200b");
      br.parentNode.insertBefore(anchor, br.nextSibling);
      r0.setStart(anchor, 1);
      r0.collapse(true);
      sel.removeAllRanges();
      sel.addRange(r0);
      saveSelection();
      return;
    }

    if (e.key !== "Backspace" && e.key !== "Delete") return;

    var collapsed = !sel || !sel.rangeCount || sel.isCollapsed;
    if (!collapsed) return;   // 有选区时交给浏览器正常删除

    if (isEmptyBlock(b)) {
      e.preventDefault();
      dropBlock(b);
      updateToolbarState();
      return;
    }

    // 块首按退格 = 取消这个块的格式，而不是合并成一堆带样式的碎片
    if (e.key === "Backspace" && caretAtStart(b)) {
      e.preventDefault();
      var leaf = leafBlockOf(sel.anchorNode, b);
      var kids = Array.prototype.filter.call(b.children, function (c) {
        return /^(P|H1|H2|H3|H4|H5|H6|DIV)$/.test(c.nodeName);
      });
      // 引用块里有多个段落时，只删掉光标所在的这个空段落，别把整个引用拆了
      if (leaf && kids.length > 1 && isEmptyBlock(leaf)) {
        var prevLeaf = leaf.previousElementSibling;
        leaf.parentNode.removeChild(leaf);
        if (prevLeaf) placeCaret(prevLeaf, true);
        else placeCaret(b, false);
      } else {
        unwrapBlock(b);
      }
      updateToolbarState();
    }
  });

  // 光标一移动就同步下拉框和选区记忆（方向键、点选都覆盖）
  document.addEventListener("selectionchange", function () {
    if (mode !== "rich") return;
    saveSelection();
    updateToolbarState();
  });

  /* ============================================ 工具函数 */

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function autoSlug(title) {
    var ascii = String(title || "").toLowerCase().replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "").slice(0, 48);
    if (ascii.length >= 3) return ascii;
    var d = new Date();
    return "post-" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
      "-" + pad(d.getHours()) + pad(d.getMinutes());
  }
  function setStatus(msg, kind) {
    el.status.textContent = msg;
    el.status.className = "status" + (kind ? " " + kind : "");
  }
  function minutesOf() {
    var t = mode === "rich" ? el.rich.innerText : el.md.value;
    var n = String(t || "").replace(/\s+/g, "").length;
    return Math.max(1, Math.round(n / 400));
  }

  el.title.addEventListener("input", function () {
    if (!slugTouched) el.slug.value = autoSlug(el.title.value);
    saveDraft();
  });
  el.slug.addEventListener("input", function () {
    slugTouched = true;
    el.slug.value = el.slug.value.toLowerCase().replace(/[^a-z0-9-]/g, "");
    saveDraft();
  });
  [el.date, el.excerpt].forEach(function (n) { n.addEventListener("input", saveDraft); });
  el.category.addEventListener("change", saveDraft);

  el.md.addEventListener("input", function () {
    if (mdTimer) clearTimeout(mdTimer);
    mdTimer = setTimeout(function () { renderMdPreview(); saveDraft(); }, 180);
  });
  el.rich.addEventListener("input", function () {
    if (mdTimer) clearTimeout(mdTimer);
    mdTimer = setTimeout(saveDraft, 400);
  });

  /* ============================================ 类别 */

  function loadCategories() {
    return fetch("/api/categories").then(function (r) { return r.json(); })
      .then(function (res) {
        var cats = res.categories || [];
        var cur = window.__pendingCat || null;
        el.category.innerHTML = cats.map(function (c) {
          return '<option value="' + esc(c) + '">' + esc(c) + "</option>";
        }).join("") + '<option value="__new__">＋ 新建类别…</option>';
        if (cur) { el.category.value = cur; window.__pendingCat = null; }
        return cats;
      });
  }

  el.category.addEventListener("change", function () {
    if (el.category.value !== "__new__") return;
    var name = prompt("新类别名称");
    if (!name || !name.trim()) { el.category.selectedIndex = 0; return; }
    fetch("/api/categories", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "add", name: name.trim() })
    }).then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) { setStatus(res.error || "添加失败", "err"); return; }
        window.__pendingCat = name.trim();
        loadCategories().then(function () {
          setStatus("已新增类别「" + name.trim() + "」", "ok");
        });
      });
  });

  /* ============================================ 历史文章 */

  function loadPosts() {
    fetch("/api/posts").then(function (r) { return r.json(); })
      .then(function (res) {
        var posts = res.posts || [];
        el.postCount.textContent = posts.length ? String(posts.length) : "";
        if (!posts.length) {
          el.postItems.innerHTML = '<li class="side-empty">还没有文章</li>';
          return;
        }
        el.postItems.innerHTML = posts.map(function (p) {
          return '<li data-slug="' + esc(p.slug) + '"' +
            (p.slug === currentSlug ? ' class="active"' : "") + ">" +
            '<span class="pi-title" title="' + esc(p.title) + '">' + esc(p.title) + "</span>" +

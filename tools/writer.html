            '<span class="pi-meta"><span>' + esc(p.date) + "</span><span>" +
            esc(p.category || "未分类") + "</span></span>" +
            '<button class="pi-del" title="删除">✕</button></li>';
        }).join("");
      });
  }

  el.postItems.addEventListener("click", function (e) {
    var del = e.target.closest(".pi-del");
    var li = e.target.closest("li[data-slug]");
    if (!li) return;
    var slug = li.getAttribute("data-slug");

    if (del) {
      e.stopPropagation();
      if (!confirm("确定删除《" + (li.querySelector(".pi-title").textContent || slug) +
        "》？\n只删本地的，点顶栏「更新」才推到 GitHub。")) return;
      setStatus("正在删除…");
      fetch("/api/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ slug: slug })
      }).then(function (r) { return r.json(); })
        .then(function (res) {
          if (!res.ok) { setStatus("删除失败：" + (res.error || ""), "err"); return; }
          if (currentSlug === slug) newPost();
          setStatus("已从本地删掉 · 点「更新」推上线", "ok");
          loadPosts();
          refreshSync();
        })
        .catch(function () { setStatus("连不上本地服务", "err"); });
      return;
    }
    openPost(slug);
  });

  function openPost(slug) {
    fetch("/api/post?slug=" + encodeURIComponent(slug))
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) { setStatus("打开失败", "err"); return; }
        var p = res.post;
        if (draftInfo && draftInfo.currentSlug !== p.slug) el.draftBar.hidden = true;
        currentSlug = p.slug;
        el.title.value = p.title || "";
        el.date.value = p.date || todayStr();
        el.excerpt.value = p.excerpt || "";
        el.slug.value = p.slug;
        slugTouched = true;

        if ((p.mode || "rich") === "md") {
          el.md.value = healEscapedMd(p.source || "");
          el.rich.innerHTML = mdToHtml(el.md.value);
        } else {
          el.rich.innerHTML = p.source || p.body_html || "";
          reviveEscapedFmt(el.rich);
          el.md.value = htmlToMd(el.rich.innerHTML);
        }
        ensureChips();
        paintAll();
        renderMdPreview();

        if (p.category) { window.__pendingCat = p.category; loadCategories(); }
        setStatus("正在编辑《" + p.title + "》");
        loadPosts();
      });
  }

  /* ============================================ 草稿 */

  function currentBodyHtml() {
    if (mode === "rich") {
      var clone = el.rich.cloneNode(true);
      unpaintAll(clone);                // 染色是显示层，不进线上正文
      reviveEscapedFmt(clone);          // 旧草稿里的转义标签先还原，再导出
      sanitize(clone, { fmt: true });
      // 代码块回车用的零宽锚点只在编辑器里有用，别带进线上文章
      return clone.innerHTML.replace(/\u200b/g, "");
    }
    return mdToHtml(el.md.value);
  }

  function currentSource() {
    if (mode !== "rich") return el.md.value;
    return el.rich.querySelector("pre.hl-on") ? stripHl(el.rich.innerHTML) : el.rich.innerHTML;
  }

  function saveDraft() {
    try {
      localStorage.setItem(STORE, JSON.stringify({
        mode: mode, currentSlug: currentSlug,
        title: el.title.value, date: el.date.value,
        category: el.category.value, slug: el.slug.value,
        excerpt: el.excerpt.value,
        rich: currentSource(), md: el.md.value, slugTouched: slugTouched
      }));
    } catch (e) {}
  }

  function loadDraft() {
    var raw;
    try { raw = localStorage.getItem(STORE); } catch (e) { return false; }
    if (!raw) return false;
    try {
      var d = JSON.parse(raw);
      if (!d.title && !d.rich && !d.md) return false;
      draftInfo = d;
      el.title.value = d.title || "";
      el.date.value = d.date || todayStr();
      el.excerpt.value = d.excerpt || "";
      el.slug.value = d.slug || "";
      el.rich.innerHTML = d.rich || "";
      el.md.value = healEscapedMd(d.md || "");
      reviveEscapedFmt(el.rich);
      ensureChips();
      paintAll();
      currentSlug = d.currentSlug || "";
      slugTouched = !!d.slugTouched;
      if (d.category) window.__pendingCat = d.category;
      if (d.mode === "md") setMode("md");
      renderMdPreview();
      return true;
    } catch (e) { return false; }
  }

  /* 草稿 vs 线上版：草稿是"上次没发布的内容"，优先级一直被排在磁盘文件前面。
     如果它是旧版本（比如只存了半篇），打开写作台看到的就是短一截的文章，
     一发布还会把线上好好的文章覆盖掉。所以这里对一下，不一致就摆个提示条让你选。 */
  var draftInfo = null;

  function normSrc(s) {
    return String(s || "").replace(/[\s\u200b\u00a0]+/g, "");
  }

  function checkDraftConflict() {
    if (!draftInfo || !draftInfo.currentSlug) return;
    var slug = draftInfo.currentSlug;
    fetch("/api/post?slug=" + encodeURIComponent(slug), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok || !res.post) return;
        var p = res.post;
        if (p.slug !== currentSlug) return;          // 期间已经切到别的文章了
        var isMd = (p.mode || "rich") === "md";
        var disk = p.source || "";
        var mine = isMd ? (draftInfo.md || "") : (draftInfo.rich || "");
        if (normSrc(mine) === normSrc(disk)) return;  // 一样，不用管

        var a = normSrc(mine).length, b = normSrc(disk).length;
        el.draftBarText.innerHTML =
          "本地草稿和线上版不一样：《" + esc(p.title || slug) + "》草稿 <b>" +
          a.toLocaleString() + "</b> 字 / 线上 <b>" + b.toLocaleString() + "</b> 字。" +
          (a < b ? "草稿看起来短一截，可能是旧版本。" : "草稿更长，可能是你后来补的内容。");
        el.draftBar.hidden = false;

        el.draftDisk.onclick = function () {
          el.draftBar.hidden = true;
          openPost(slug);
          setTimeout(saveDraft, 600);   // 用线上版覆盖掉旧草稿
          setStatus("已换成线上版", "ok");
        };
        el.draftKeep.onclick = function () {
          el.draftBar.hidden = true;
          saveDraft();
          setStatus("保留草稿，发布时按草稿来", "ok");
        };
      })
      .catch(function () {});
  }

  /* ============================================ 更新（把本地改动推到 GitHub） */

  var syncing = false;

  // 发布和更新都用这个：代理不稳时能看出卡在「提交」还是「推送」第几次
  function progressPoller(t0) {
    return setInterval(function () {
      fetch("/api/progress", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          var p = res && res.progress;
          if (!p || !p.stage) return;
          var secs = Math.round((Date.now() - t0) / 1000);
          setStatus(p.stage + (p.detail ? " · " + p.detail : "") + " · " + secs + " 秒");
        })
        .catch(function () {});
    }, 700);
  }

  function paintSync(ch) {
    var n = (ch && ch.count) || 0;
    var ahead = (ch && ch.ahead) || 0;
    var total = n + ahead;
    el.syncBadge.hidden = total === 0;
    el.syncBadge.textContent = total > 99 ? "99+" : String(total);
    el.syncBtn.classList.toggle("dirty", total > 0);
    if (!total) {
      el.syncBtn.title = "本地和线上一致";
      return;
    }
    var parts = [];
    if (n) parts.push("本地有 " + n + " 个文件改动");
    if (ahead) parts.push(ahead + " 个提交还没推上去");
    el.syncBtn.title = parts.join("，") + "。点一下一次性推上去";
  }

  function refreshSync() {
    fetch("/api/sync", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (res) { if (res && res.ok) paintSync(res.changes); })
      .catch(function () {});
  }

  function syncNow() {
    if (syncing) return;
    syncing = true;
    el.syncBtn.disabled = true;
    var t0 = Date.now();
    setStatus("正在更新…");
    var progTimer = progressPoller(t0);
    var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var hardTimer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 240000);

    function done() {
      clearInterval(progTimer);
      clearTimeout(hardTimer);
      syncing = false;
      el.syncBtn.disabled = false;
    }

    fetch("/api/sync", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({}),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) { return r.json(); })
      .then(function (res) {
        done();
        if (res.ok && res.noop) {
          setStatus(res.message || "没有要更新的改动", "ok");
        } else if (res.ok) {
          setStatus("已更新 · " + (res.via || "直连") + " · 约 30 秒后生效", "ok");
        } else if (res.stage === "push") {
          setStatus("改动已提交在本地，但没推上去：" +
            String(res.error || "").slice(0, 120) + "。网络好了再点一次「更新」。", "err");
        } else {
          setStatus("更新失败（" + (res.stage || "?") + "）：" + (res.error || ""), "err");
        }
        refreshSync();
      })
      .catch(function (e) {
        done();
        if (e && e.name === "AbortError") setStatus("等了 4 分钟还没推完，已停止等待", "err");
        else setStatus("连不上本地服务，确认 写作台.bat 还在运行", "err");
        refreshSync();
      });
  }

  /* ============================================ 从 GitHub 拉取 / 找回删掉的文章 */

  var pulling = false;
  var deletedCache = [];

  function pullNow() {
    if (pulling) return;
    pulling = true;
    el.pullBtn.disabled = true;
    var t0 = Date.now();
    setStatus("正在从 GitHub 拉取…");
    var progTimer = progressPoller(t0);
    var openSlug = currentSlug;

    fetch("/api/pull", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}"
    }).then(function (r) { return r.json(); })
      .then(function (res) {
        clearInterval(progTimer);
        pulling = false;
        el.pullBtn.disabled = false;
        if (!res.ok) {
          setStatus(res.message || ("拉取失败：" + (res.error || "")), "err");
          return;
        }
        setStatus(res.message || "已拉取", "ok");
        loadPosts();
        loadCategories();
        refreshSync();
        loadDeleted();
        // 正在写的那篇如果也被远端改了，问一句再重载，别把手上没保存的改动冲掉
        if (openSlug && (res.files || []).indexOf("posts/" + openSlug + ".html") >= 0) {
          if (confirm("《" + (el.title.value || openSlug) + "》在 GitHub 上有新版，重新载入？\n" +
                      "选「取消」就保留你现在编辑器里的内容。")) openPost(openSlug);
        }
      })
      .catch(function () {
        clearInterval(progTimer);
        pulling = false;
        el.pullBtn.disabled = false;
        setStatus("连不上本地服务，确认 写作台.bat 还在运行", "err");
      });
  }

  function loadDeleted() {
    fetch("/api/deleted", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        deletedCache = (res && res.posts) || [];
        el.restoreBtn.hidden = !deletedCache.length;
        el.restoreCount.textContent = deletedCache.length ? "（" + deletedCache.length + "）" : "";
      })
      .catch(function () {});
  }

  function openRestorePop() {
    if (!deletedCache.length) { setStatus("历史里没有可找回的文章", "ok"); return; }
    el.restoreList.innerHTML = deletedCache.map(function (p) {
      return '<div class="rp-item" data-slug="' + esc(p.slug) + '">' +
        '<span class="rp-title" title="' + esc(p.title) + '">' + esc(p.title) + "</span>" +
        '<span class="rp-date">' + esc(p.deleted || "") + "</span>" +
        '<button class="rp-go">找回</button></div>';
    }).join("");
    el.restorePop.hidden = false;
    var r = el.restoreBtn.getBoundingClientRect();
    el.restorePop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 348)) + "px";
    el.restorePop.style.bottom = Math.max(8, window.innerHeight - r.top + 8) + "px";
  }

  el.pullBtn.addEventListener("click", pullNow);
  el.restoreBtn.addEventListener("click", openRestorePop);
  el.restoreClose.addEventListener("click", function () { el.restorePop.hidden = true; });

  el.restoreList.addEventListener("click", function (e) {
    var btn = e.target.closest(".rp-go");
    if (!btn) return;
    var item = btn.closest(".rp-item");
    var slug = item.getAttribute("data-slug");
    btn.disabled = true;
    btn.textContent = "…";
    fetch("/api/restore", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ slug: slug })
    }).then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) {
          setStatus("找回失败：" + (res.error || ""), "err");
          btn.disabled = false; btn.textContent = "找回";
          return;
        }
        setStatus(res.message || "已找回", "ok");
        el.restorePop.hidden = true;
        loadPosts();
        loadDeleted();
        refreshSync();
        openPost(slug);
      })
      .catch(function () {
        setStatus("连不上本地服务", "err");
        btn.disabled = false; btn.textContent = "找回";
      });
  });

  document.addEventListener("click", function (e) {
    if (el.restorePop.hidden) return;
    if (el.restorePop.contains(e.target) || el.restoreBtn.contains(e.target)) return;
    el.restorePop.hidden = true;
  });

  /* ============================================ 新建 / 发布 */

  function newPost() {
    if (!currentSlug && (el.title.value.trim() || el.rich.textContent.trim() || el.md.value.trim())) {
      if (!confirm("清空当前内容？")) return;
    }
    currentSlug = "";
    el.draftBar.hidden = true;
    draftInfo = null;
    el.title.value = "";
    el.excerpt.value = "";
    el.rich.innerHTML = "";
    el.md.value = "";
    el.date.value = todayStr();
    el.slug.value = autoSlug("");
    slugTouched = false;
    renderMdPreview();
    setMode("rich");
    saveDraft();
    loadPosts();
    setStatus("新文章");
    el.title.focus();
  }

  function publish() {
    var title = el.title.value.trim();
    var slug = el.slug.value.trim();
    var body = currentBodyHtml();

    if (!title) { setStatus("标题还没填", "err"); el.title.focus(); return; }
    if (!String(body).replace(/<[^>]+>/g, "").replace(/&nbsp;/g, "").trim()) {
      setStatus("正文是空的", "err"); return;
    }
    if (!/^[a-z0-9][a-z0-9-]*$/.test(slug)) {
      setStatus("短名只能用小写字母、数字和短横线", "err"); el.slug.focus(); return;
    }

    var cat = el.category.value === "__new__" ? "" : el.category.value;

    var payload = {
      title: title, slug: slug, date: el.date.value || todayStr(),
      category: cat,
      excerpt: el.excerpt.value.trim() || title,
      body_html: body,
      source: currentSource(),
      mode: mode,
      minutes: minutesOf()
    };

    el.pubBtn.disabled = true;
    var t0 = Date.now();
    setStatus("正在发布…");

    // 轮询服务端进度：代理不稳时能看出卡在「提交」还是「推送」第几次
    var progTimer = progressPoller(t0);

    var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var hardTimer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 240000);

    function finish() {
      clearInterval(progTimer);
      clearTimeout(hardTimer);
      el.pubBtn.disabled = false;
    }

    fetch("/api/publish", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) { return r.json(); })
      .then(function (res) {
        finish();
        if (res.ok) {
          currentSlug = res.slug;
          slugTouched = true;
          setStatus((res.existed ? "已更新" : "已发布") + " · " +
            (res.via || "直连") + " · 约 30 秒后生效", "ok");
          window.open(res.url, "_blank", "noopener");
          loadPosts();
          refreshSync();
        } else if (res.stage === "push") {
          setStatus("已提交到本地，但没推上去：" +
            String(res.error || "").slice(0, 120) +
            "。网络好了再点一次发布即可（不会产生重复文章）。", "err");
        } else {
          setStatus("失败（" + (res.stage || "?") + "）：" + (res.error || ""), "err");
          console.error(res);
        }
      })
      .catch(function (e) {
        finish();
        if (e && e.name === "AbortError") {
          setStatus("等了 4 分钟还没推完，已停止等待。本地文件可能已经改好了，" +
            "检查代理后点一次发布重试。", "err");
        } else {
          setStatus("连不上本地服务，确认 写作台.bat 还在运行", "err");
        }
        console.error(e);
      });
  }

  /* ============================================ AI 小窗（悬浮） */

  var LS_DOCK = "xiray-ai-dock";

  function vw() { return document.documentElement.clientWidth; }
  function vh() { return document.documentElement.clientHeight; }

  function defaultDock() {
    var w = Math.min(430, vw() - 32);
    var top = 64;
    return { left: Math.max(8, vw() - w - 16), top: top, width: w, height: Math.max(260, vh() - top - 16) };
  }

  function clampDock(r) {
    var minW = Math.min(320, vw() - 24), minH = Math.min(240, vh() - 24);
    r.width = Math.max(minW, Math.min(r.width, vw() - 16));
    r.height = Math.max(minH, Math.min(r.height, vh() - 16));
    r.left = Math.max(8, Math.min(r.left, vw() - r.width - 8));
    r.top = Math.max(8, Math.min(r.top, vh() - r.height - 8));
    return r;
  }

  function applyDock(r) {
    r = clampDock(r);
    el.aiDock.style.left = r.left + "px";
    el.aiDock.style.top = r.top + "px";
    el.aiDock.style.width = r.width + "px";
    el.aiDock.style.height = r.height + "px";
    return r;
  }

  function dockRect() {
    return {
      left: el.aiDock.offsetLeft, top: el.aiDock.offsetTop,
      width: el.aiDock.offsetWidth, height: el.aiDock.offsetHeight
    };
  }

  function loadDock() {
    try {
      var r = JSON.parse(localStorage.getItem(LS_DOCK) || "null");
      if (r && r.width > 200 && r.height > 200 && typeof r.left === "number" && typeof r.top === "number") return r;
    } catch (e) {}
    return null;
  }
  function saveDock() {
    try { localStorage.setItem(LS_DOCK, JSON.stringify(dockRect())); } catch (e) {}
  }

  function openDock() {
    if (!el.aiDockFrame.getAttribute("src")) {
      el.aiDockFrame.src = "/ai?mini=1&embed=1";
    }
    if (el.aiDock.hidden) {
      el.aiDock.hidden = false;
      applyDock(loadDock() || defaultDock());
    }
    el.aiBtn.classList.add("on");
  }

  function closeDock() {
    saveDock();                    // 先存再隐藏，隐藏后 offsetWidth 会变成 0
    el.aiDock.hidden = true;
    el.aiBtn.classList.remove("on");
    setTimeout(function () { el.rich.focus(); }, 0);
  }

  function onAiBtn(e) {
    if (e && e.shiftKey) { window.open("/ai", "_blank", "noopener"); return; }
    if (el.aiDock.hidden) openDock(); else closeDock();
  }

  var dockDrag = null;

  function startDrag(mode, e) {
    e.preventDefault();
    dockDrag = { mode: mode, x: e.clientX, y: e.clientY, rect: dockRect() };
    el.aiDockFrame.style.pointerEvents = "none";
    document.body.style.userSelect = "none";
  }

  el.aiDockBar.addEventListener("mousedown", function (e) {
    if (e.button !== 0 || e.target.closest("button")) return;
    startDrag("move", e);
  });
  el.aiDockGrip.addEventListener("mousedown", function (e) {
    if (e.button !== 0) return;
    startDrag("size", e);
  });

  document.addEventListener("mousemove", function (e) {
    if (!dockDrag) return;
    var dx = e.clientX - dockDrag.x, dy = e.clientY - dockDrag.y;
    var r = dockDrag.rect;
    if (dockDrag.mode === "move") {
      applyDock({ left: r.left + dx, top: r.top + dy, width: r.width, height: r.height });
    } else {
      applyDock({ left: r.left, top: r.top, width: r.width + dx, height: r.height + dy });
    }
  });

  document.addEventListener("mouseup", function () {
    if (!dockDrag) return;
    dockDrag = null;
    el.aiDockFrame.style.pointerEvents = "";
    document.body.style.userSelect = "";
    saveDock();
  });

  window.addEventListener("resize", function () {
    if (!el.aiDock.hidden) applyDock(dockRect());
  });

  el.aiDockClose.addEventListener("click", closeDock);
  el.aiDockFull.addEventListener("click", function () {
    window.open("/ai", "_blank", "noopener");
  });

  el.pubBtn.addEventListener("click", publish);
  el.newBtn.addEventListener("click", newPost);
  el.newBtn2.addEventListener("click", newPost);
  el.importBtn.addEventListener("click", function () { el.mdPicker.click(); });
  el.mdPicker.addEventListener("change", function () {
    var f = el.mdPicker.files && el.mdPicker.files[0];
    el.mdPicker.value = "";
    importMarkdown(f);
  });
  el.proxyBtn.addEventListener("click", toggleProxy);
  bindDrop();
  el.aiBtn.addEventListener("click", onAiBtn);
  el.syncBtn.addEventListener("click", syncNow);
  el.modeRich.addEventListener("click", function () { setMode("rich"); });
  el.modeMd.addEventListener("click", function () { setMode("md"); });

  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); publish(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
      e.preventDefault(); saveDraft(); setStatus("草稿已保存", "ok");
    }
  });

  /* ============================================ 导入本地 Markdown */

  function fmSplit(text) {
    // 支持 --- front matter ---：title / date / category / excerpt / slug / tags
    var m = String(text || "").match(/^\uFEFF?---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
    if (!m) return { meta: {}, body: text };
    var meta = {};
    m[1].split(/\r?\n/).forEach(function (line) {
      var kv = line.match(/^\s*([A-Za-z_-]+)\s*:\s*(.*)$/);
      if (!kv) return;
      meta[kv[1].toLowerCase()] = kv[2].trim().replace(/^["']|["']$/g, "");
    });
    return { meta: meta, body: String(text).slice(m[0].length) };
  }

  function firstPara(md) {
    var blocks = String(md || "").split(/\n{2,}/);
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i].trim();
      if (!b || /^#{1,6}\s/.test(b) || /^```/.test(b) || /^[-*]\s/.test(b)) continue;
      return b.replace(/[`*_>#]/g, "").replace(/\s+/g, " ").slice(0, 90);
    }
    return "";
  }

  function importMarkdown(file) {
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { setStatus("文件太大（超过 5MB），先拆一下", "err"); return; }
    var dirty = !!(currentSlug || el.title.value.trim() ||
                   el.rich.textContent.trim() || el.md.value.trim());
    if (dirty && !confirm("导入会覆盖当前编辑区的内容，继续？")) return;
    var fr = new FileReader();
    fr.onerror = function () { setStatus("读文件失败", "err"); };
    fr.onload = function () { applyMarkdown(String(fr.result || ""), file.name); };
    fr.readAsText(file, "utf-8");
  }

  function applyMarkdown(text, filename) {
    var split = fmSplit(text);
    var meta = split.meta, body = split.body.replace(/\r\n/g, "\n");

    var title = meta.title || "";
    var lines = body.split("\n");
    if (!title) {
      for (var i = 0; i < lines.length && i < 40; i++) {
        var hm = lines[i].match(/^\s{0,3}#\s+(.+?)\s*#*\s*$/);
        if (hm) { title = hm[1].trim(); lines.splice(i, 1); break; }
      }
      body = lines.join("\n");
    }
    var stem = String(filename || "").replace(/\.[^.]+$/, "");
    if (!title) title = stem || "未命名";

    currentSlug = "";
    slugTouched = false;
    // 先切模式：setMode("md") 会拿富文本内容去覆盖 mdEditor，
    // 必须等它做完再把文件内容写进去，不然刚导入的正文会被空编辑器冲掉。
    setMode("md");
    el.title.value = title;
    el.md.value = body.replace(/^\n+/, "");
    el.date.value = /^\d{4}-\d{2}-\d{2}$/.test(meta.date || "") ? meta.date : todayStr();
    el.excerpt.value = meta.excerpt || meta.description || firstPara(body);
    el.slug.value = (meta.slug && /^[a-z0-9][a-z0-9-]*$/.test(meta.slug))
      ? meta.slug
      : (slugifyAscii(stem) || autoSlug(title));

    if (meta.category) {
      if (![].some.call(el.category.options, function (o) { return o.value === meta.category; })) {
        fetch("/api/categories", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "add", name: meta.category })
        }).then(function () { loadCategories(); 
          setTimeout(function () { el.category.value = meta.category; }, 300);
        }).catch(function () {});
      } else {
        el.category.value = meta.category;
      }
    }

    setMode("md");
    renderMdPreview();
    saveDraft();

    var localImgs = (body.match(/!\[[^\]]*\]\(([^)\s]+)/g) || []).length;
    var remote = (body.match(/!\[[^\]]*\]\((https?:)/g) || []).length;
    setStatus("已导入「" + filename + "」· " + body.length + " 字符" +
      (meta.title ? "（含 front matter）" : "") +
      (localImgs - remote > 0 ? " · 有 " + (localImgs - remote) + " 张本地图片要手动传" : ""), "ok");
  }

  function slugifyAscii(s) {
    return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "").slice(0, 48);
  }

  /* 拖文件进来：.md 直接导入，图片走上传流程（和工具栏图片按钮同一条路） */
  function bindDrop() {
    var zone = document.querySelector(".main");
    if (!zone) return;
    var mask = document.createElement("div");
    mask.className = "drop-mask";
    mask.innerHTML = "<b>松手导入</b><span>.md / .markdown 进正文，图片直接上传插入</span>";
    document.querySelector(".app").appendChild(mask);

    var depth = 0;
    function hasFiles(e) {
      var dt = e.dataTransfer;
      if (!dt) return false;
      return !!(dt.types && Array.prototype.indexOf.call(dt.types, "Files") >= 0);
    }
    zone.addEventListener("dragenter", function (e) {
      if (!hasFiles(e)) return;
      e.preventDefault(); depth++; mask.classList.add("on");
    });
    zone.addEventListener("dragover", function (e) { if (hasFiles(e)) e.preventDefault(); });
    zone.addEventListener("dragleave", function () { if (--depth <= 0) { depth = 0; mask.classList.remove("on"); } });
    zone.addEventListener("drop", function (e) {
      if (!hasFiles(e)) return;
      e.preventDefault(); depth = 0; mask.classList.remove("on");
      var files = Array.prototype.slice.call(e.dataTransfer.files || []);
      var mds = files.filter(function (f) { return /\.(md|markdown|txt)$/i.test(f.name); });
      var imgs = files.filter(function (f) { return /^image\//.test(f.type); });
      if (mds.length) { importMarkdown(mds[0]); return; }
      if (imgs.length && typeof uploadFile === "function") {
        imgs.forEach(function (f) { uploadFile(f, true); });
      }
    });
  }

  /* ============================================ 代理开关（7897 / 直连） */

  var proxyState = null;

  function paintProxy(st) {
    if (!st) return;
    proxyState = st;
    var on = st.mode === "proxy";
    el.proxyBtn.textContent = on ? "代理 " + String(st.url || "").replace(/^https?:\/\//, "") : "直连";
    el.proxyBtn.title = (on ? "走代理 " + st.url : "不走代理，直接连") +
      (st.ok === false ? "（刚才探测不通，推送时会自动降级直连）" : "") + "\n点一下切换";
    el.proxyBtn.classList.toggle("warn", st.ok === false);
  }

  function refreshProxy() {
    fetch("/api/proxy", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (res) { if (res && res.ok) paintProxy(res.status); })
      .catch(function () {});
  }

  function toggleProxy() {
    var next = (proxyState && proxyState.mode === "proxy") ? "off" : "proxy";
    el.proxyBtn.disabled = true;
    fetch("/api/proxy", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: next })
    }).then(function (r) { return r.json(); })
      .then(function (res) {
        el.proxyBtn.disabled = false;
        if (!res.ok) { setStatus("切换失败：" + (res.error || ""), "err"); return; }
        paintProxy(res.status);
        setStatus(next === "off" ? "已改成直连（不走代理）"
          : "已改成走代理 " + res.config.url, "ok");
      })
      .catch(function () { el.proxyBtn.disabled = false; setStatus("切换失败：连不上本地服务", "err"); });
  }

  /* ============================================ Agent 桥（给小窗里的 AI 用）
     AI 输出 ```writer-agent {json}``` 块，这里负责把动作落到编辑器上。
     应用前先拍快照，「撤销」能回到应用之前。 */

  var agentSnap = null;

  function agentContext() {
    return {
      title: el.title.value, slug: el.slug.value, excerpt: el.excerpt.value,
      category: el.category.value === "__new__" ? "" : el.category.value,
      date: el.date.value, mode: mode,
      text: mode === "rich" ? (el.rich.innerText || "") : el.md.value,
      html: mode === "rich" ? el.rich.innerHTML : "",
      md: mode === "md" ? el.md.value : ""
    };
  }

  function agentSnapshot() {
    return {
      title: el.title.value, excerpt: el.excerpt.value, category: el.category.value,
      slug: el.slug.value, date: el.date.value, mode: mode,
      rich: el.rich.innerHTML, md: el.md.value, slugTouched: slugTouched,
      catRaw: el.category.value
    };
  }

  function agentRestore(s) {
    if (!s) return false;
    el.title.value = s.title; el.excerpt.value = s.excerpt;
    el.date.value = s.date; el.slug.value = s.slug;
    el.rich.innerHTML = s.rich; el.md.value = s.md;
    slugTouched = s.slugTouched;
    setMode(s.mode || "rich");
    if (el.category.value !== s.catRaw) {
      window.__pendingCat = s.catRaw;
      loadCategories();
      setTimeout(function () { el.category.value = s.catRaw; }, 300);
    }
    ensureChips(); paintAll(); renderMdPreview(); saveDraft();
    return true;
  }

  function appendHtml(html) {
    if (mode === "md") {
      el.md.value = el.md.value.replace(/\s*$/, "") + "\n\n" + htmlToMd(html) + "\n";
      renderMdPreview();
      return;
    }
    var box = document.createElement("div");
    box.innerHTML = html;
    sanitize(box, { fmt: true });
    while (box.firstChild) el.rich.appendChild(box.firstChild);
    ensureChips();
    paintAll();
  }

  function replaceBody(html) {
    if (mode === "md") {
      el.md.value = htmlToMd(html) + "\n";
      renderMdPreview();
      return;
    }
    var box = document.createElement("div");
    box.innerHTML = html;
    sanitize(box, { fmt: true });
    el.rich.innerHTML = "";
    while (box.firstChild) el.rich.appendChild(box.firstChild);
    ensureChips();
    paintAll();
  }

  function applyAgent(actions) {
    if (!Array.isArray(actions) || !actions.length) {
      return { ok: false, error: "没有可执行的动作" };
    }
    agentSnap = agentSnapshot();
    var done = [];
    try {
      actions.forEach(function (a) {
        var op = (a && a.op) || "";
        if (op === "set_meta") {
          var changed = [];
          ["title", "excerpt", "date", "slug"].forEach(function (k) {
            if (typeof a[k] === "string" && a[k].trim() !== "") {
              el[k].value = k === "slug" ? slugifyAscii(a[k]) || el[k].value : a[k].trim();
              if (k === "slug") { slugTouched = true; changed.push("短名"); }
              else if (k === "title") changed.push("标题");
              else if (k === "excerpt") changed.push("摘要");
              else changed.push("日期");
            }
          });
          if (typeof a.category === "string" && a.category.trim()) {
            var want = a.category.trim();
            window.__pendingCat = want;
            loadCategories();
            setTimeout(function () { el.category.value = want; saveDraft(); }, 350);
            changed.push("类别");
          }
          if (changed.length) done.push("改了" + changed.join("/"));
        } else if (op === "append_md") {
          if (a.md) { appendHtml(mdToHtml(a.md)); done.push("追加一段（" + a.md.length + " 字符）"); }
        } else if (op === "replace_md") {
          if (a.md) { replaceBody(mdToHtml(a.md)); done.push("整篇正文重写（" + a.md.length + " 字符）"); }
        } else if (op === "open_post") {
          if (a.slug) { openPost(String(a.slug)); done.push("打开《" + a.slug + "》"); }
        } else if (op === "new_post") {
          newPost(); done.push("新建草稿");
        } else {
          done.push("跳过不认识的 " + op);
        }
      });
    } catch (e) {
      return { ok: false, error: String((e && e.message) || e) };
    }
    if (mode === "md") renderMdPreview();
    saveDraft();
    setStatus("AI 已改：" + done.join("，") + " · 可以「撤销」", "ok");
    return { ok: true, applied: done };
  }

  window.__XI_AGENT = {
    context: agentContext,
    apply: applyAgent,
    canUndo: function () { return !!agentSnap; },
    undo: function () {
      var ok = agentRestore(agentSnap);
      agentSnap = null;
      if (ok) setStatus("已撤销 AI 的改动", "ok");
      return ok;
    }
  };

  /* ============================================ 启动 */

  loadCategories();
  var had = loadDraft();
  if (!el.date.value) el.date.value = todayStr();
  if (!el.slug.value) el.slug.value = autoSlug("");
  renderMdPreview();
  loadPosts();
  refreshSync();
  refreshProxy();
  loadDeleted();
  checkDraftConflict();
  window.addEventListener("focus", refreshSync);
  setStatus(had ? "已恢复上次未发布的内容" : "就绪");

  // 暴露转换器，供离线测试页调用（纯函数，无副作用）
  window.__convert = { toMd: htmlToMd, toHtml: mdToHtml };
})();
</script>

</body>
</html>
